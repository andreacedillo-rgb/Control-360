<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROL 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior con rol, pestañas por rol, lista de requisiciones y panel lateral de detalle. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#f7f9fa; --ink:#14232b; --muted:#5b6c74; --line:#d8e0e3;
  --accent:#0b5f7a; --accent-ink:#ffffff; --accent-soft:#e0eff4;
  --ok:#1b7447; --ok-soft:#e0f2e8; --warn:#8f5206; --warn-soft:#fcefd6;
  --bad:#a8261f; --bad-soft:#fae3e1; --info:#3d4fa3; --info-soft:#e7eaf9;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,35,43,.06),0 4px 14px rgba(20,35,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --surface:#17252c; --surface-2:#1c2c34; --ink:#e6eef1; --muted:#9bb0b8; --line:#2b3d46;
    --accent:#5cc0de; --accent-ink:#0b1b21; --accent-soft:#183a47;
    --ok:#62d093; --ok-soft:#163a29; --warn:#f0b35a; --warn-soft:#3d2d12;
    --bad:#ff8f87; --bad-soft:#442220; --info:#9eb0ff; --info-soft:#232b52;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17252c; --surface-2:#1c2c34; --ink:#e6eef1; --muted:#9bb0b8; --line:#2b3d46;
  --accent:#5cc0de; --accent-ink:#0b1b21; --accent-soft:#183a47;
  --ok:#62d093; --ok-soft:#163a29; --warn:#f0b35a; --warn-soft:#3d2d12;
  --bad:#ff8f87; --bad-soft:#442220; --info:#9eb0ff; --info-soft:#232b52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:none;margin:0;padding:10px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:18px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600;color:var(--ink)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{position:sticky;top:var(--topH,57px);height:calc(100vh - var(--topH,57px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px}
.side-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.menu-btn{display:none}
.side-ov{display:none}
.nav button{background:none;border:0;border-left:3px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;font-size:14.5px}
.nav .nav-g{font-weight:700;color:var(--ink);border-left-color:transparent;margin-top:6px;font-size:14px;letter-spacing:.01em}
.nav .nav-i{padding-left:26px;font-size:14px}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.badge.new::after{content:" Nuevo";font-weight:600}

main{width:100%;min-width:0;max-width:none;margin:0;padding:18px 24px 80px;display:flex;flex-direction:column;gap:16px}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat small{font-size:12px;color:var(--muted)}

h2.sec{font-size:15px;margin:4px 0 0;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.req{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,box-shadow .15s}
.req:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.req-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.folio{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.req-title{font-weight:600;font-size:16px}
.req-meta{font-size:13px;color:var(--muted)}
.req-amt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.req-amt b{font-size:18px;font-variant-numeric:tabular-nums}
.req-amt small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-info{background:var(--info-soft);color:var(--info)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:52ch}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* formularios */
.form{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.f input[readonly]{background:var(--surface-2);font-weight:600}
.lcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lcard-h{display:flex;justify-content:space-between;align-items:center}
.lcard-h b{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.file-line{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.file-line input[type=file]{display:none}

/* destino */
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:520px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt{align-items:center;font-size:16px}
.f .opt input{width:auto;flex:none;margin:0}
.opt span{display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:12.5px}
/* tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--surface-2);font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:12px;color:var(--muted);margin-top:2px;max-width:42ch}
td .rej{font-size:12px;color:var(--bad);margin-top:2px}
.grp{background:var(--surface-2);font-weight:600}
.grp td{padding:8px 10px}

/* panel lateral */
.ov{position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1500px,100%);background:var(--bg);z-index:41;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.drawer.on{display:flex}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dr-head h3{margin:0;font-size:24px}
.dr-body table{font-size:15px}
.dr-body td,.dr-body th{padding:12px 14px}
.dr-body td:nth-child(2),.dr-body td:nth-child(3){min-width:0}
.dr-body .mono{white-space:nowrap}
.orig{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;margin-right:8px;font-weight:500}
.dr-body td:nth-child(3),.dr-body td:nth-child(2){min-width:140px}
.dr-body td .sub{max-width:60ch;font-size:13px}
.dr-body .kv div b{font-size:17px}
.dr-body{overflow-y:auto;padding:20px 28px 48px;font-size:15.5px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-variant-numeric:tabular-nums}
.note{border-radius:10px;padding:10px 14px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.selbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);z-index:5}
.selbar b{margin-right:auto}
.hist{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-size:12px}
.hist .who{font-weight:600}
.hist .coment{background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:4px}

/* modal */
.mo{position:fixed;inset:0;background:rgba(10,20,25,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:92%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mb-h{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.mb-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mb-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* calendario */
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h h2{margin:0;font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dow{background:var(--surface-2);padding:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.off{background:var(--surface-2);opacity:.6}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink)}
.dn{font-size:12px;font-weight:600;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ev{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.95);text-decoration:underline}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:13.5px}
.mb.wide{width:min(920px,100%)}
.ev.rq{background:#fdf0d5;color:#8a5a00;border-left:3px solid #d99a00}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:250px;z-index:45;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.25);padding-top:16px}
  .side.open{transform:none}
  .side-ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}
}
@media (max-width:640px){
  .cal .day{min-height:64px}
  .hist li{grid-template-columns:1fr;gap:2px}
  .brand b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="btn menu-btn" data-act="menu" aria-label="Abrir menú">☰ Menú</button>
    <div class="brand"><b>CONTROL 360</b><span>Requisiciones · Compras · Dirección · Administración</span></div>
    <div class="role" id="role-wrap"><span id="who" class="muted" style="margin-right:10px"></span><label for="role-sel">Ver como</label>
      <select id="role-sel">
        <option value="residente">Residente</option>
        <option value="compras">Compras</option>
        <option value="direccion">Dirección</option>
        <option value="administracion">Administración</option>
        <option value="sistemas">Sistemas</option>
      </select>
    </div>
  </div>
</header>
<div class="shell">
<aside class="side" id="side"><div class="side-t">Secciones</div><nav class="nav" id="nav" aria-label="Secciones"></nav></aside>
<div class="side-ov" id="side-ov" data-act="menu"></div>
<main id="app"><div class="empty"><p>Cargando requisiciones…</p></div></main>
</div>

<div class="ov" id="ov" data-act="close"></div>
<aside class="drawer" id="drawer" aria-label="Detalle de requisición"></aside>
<div id="modal"></div>
<datalist id="provlist"></datalist>
<datalist id="obras"></datalist>
<datalist id="unidades"><option value="pza"><option value="m2"><option value="m"><option value="ml"><option value="kg"><option value="lote"><option value="jgo"><option value="servicio"><option value="hora"><option value="día"></datalist>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-adapter.js"></script>
<script>
(function(){
'use strict';

/* ───────── utilidades ───────── */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fstamp=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const code=()=>{const d=new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.random().toString(36).slice(2,5).toUpperCase();};
const clone=o=>JSON.parse(JSON.stringify(o));

const ROLES={residente:'Residente',compras:'Compras',direccion:'Dirección',administracion:'Administración',sistemas:'Sistemas'};
const TABS={
  sistemas:[['usuarios','Usuarios y permisos'],['bitacora','Bitácora de seguridad']],
  residente:[['mis','Mis gastos'],['nueva','Nuevo gasto'],['nom','Nómina'],['cal','Calendario'],['rep','Reportes']],
  compras:[['revisar','Por revisar'],['oc','Por generar OC'],['recibir','Por recibir'],['ocs','OC y entregas'],['todas','Todas'],['prov','Proveedores'],['rep','Reportes']],
  direccion:[['autorizar','Por autorizar'],['excep','Excepciones'],['nomaut','Nómina'],['resueltas','Resueltas'],['cal','Calendario'],['todas','Todas'],['prov','Proveedores'],['rep','Reportes']],
  administracion:[['revisar','Por revisar'],['pagar','Por pagar'],['credito','Crédito'],['pagadas','Pagadas'],['nomina','Nómina'],['emps','Empleados'],['cal','Calendario'],['prov','Proveedores'],['rep','Reportes']]
};

/* ───────── estado ───────── */
const S={reqs:[],role:'residente',tab:'mis',open:null,sel:new Set(),cal:new Date(),ready:false,mode:'local',draft:null,tmp:null};
let db=null,user=null,assets=null,coll=null,myId='local';
try{const r=localStorage.getItem('gp_role');if(r&&ROLES[r])S.role=r;}catch(e){}
S.tab=TABS[S.role][0][0];

/* ───────── datos ───────── */
function rows(snap){
  const val=d=>{const v=typeof d.data==='function'?d.data():d.data;return JSON.parse(JSON.stringify(Object.assign({id:d.id},v||d)));};
  if(Array.isArray(snap))return snap.map(val);
  if(snap&&snap.docs)return snap.docs.map(val);
  const out=[];if(snap&&snap.forEach)snap.forEach(d=>out.push(val(d)));return out;
}
function sortReqs(){S.reqs.sort((a,b)=>(b.creado||0)-(a.creado||0));}
async function save(r){
  r.upd=Date.now();
  const copy=clone(r);
  const i=S.reqs.findIndex(x=>x.id===r.id);
  if(i>=0)S.reqs[i]=copy;else S.reqs.push(copy);
  sortReqs();
  render();
  if(coll){
    const ref=coll.doc(r.id);let err=null;
    try{await ref.set(copy);}catch(e1){
      err=e1;
      try{await ref.update(copy);err=null;}catch(e2){err=e2;}
    }
    if(err){S.saveErr='No se pudo guardar en la base compartida: '+((err&&(err.message||err.code))||String(err));setTimeout(()=>toast(S.saveErr),50);}
  }
}

const L=r=>r.lineas||[];
const lt=l=>r2((Number(l.cant)||0)*(Number(l.pu)||0));
const reqTotal=r=>r2(sum(L(r).map(l=>l.total)));
const reqAut=r=>r2(sum(L(r).filter(l=>l.auth==='autorizada').map(l=>l.total)));
const abonado=l=>l.abonos&&l.abonos.length?r2(sum(l.abonos.map(a=>a.monto))):(l.pago==='pagado'?r2(l.total):0);
const saldo=l=>l.pago==='pagado'?0:r2(Math.max(0,(Number(l.total)||0)-(l.abonos?abonado(l):0)));
const reqPag=r=>r2(sum(L(r).map(l=>l.pago==='pagado'?l.total:(l.abonos?abonado(l):0))));
const key=(r,l)=>r.id+'|'+l.id;
function allLines(fn){const o=[];V().forEach(r=>L(r).forEach(l=>{if(fn(l,r))o.push({r:r,l:l});}));return o;}
function statusOf(r){
  const ls=L(r);
  if(r.estado==='elaboracion')return['En elaboración','mute'];
  if(r.estado!=='devuelta'&&L(r).some(l=>l.provExc&&l.provExc.estado==='pendiente'))return['Pendiente de autorización de excepción por Dirección','warn'];
  if(r.estado==='compras')return['Enviada a Compras','info'];
  if(r.estado==='administracion')return['En revisión por Administración','info'];
  if(r.estado==='devuelta')return['Devuelta al residente','warn'];
  if(r.estado==='direccion')return['Pendiente de autorización de Dirección','info'];
  const pend=ls.filter(l=>l.auth==='pendiente').length;
  const aut=ls.filter(l=>l.auth==='autorizada');
  const rech=ls.filter(l=>l.auth==='rechazada').length;
  if(aut.length&&aut.every(l=>l.pago==='pagado')&&!pend)return['Pagada','ok'];
  if(pend&&aut.length)return['Autorizada parcial','warn'];
  if(pend)return['Pendiente de autorización de Dirección','info'];
  if(rech===ls.length)return['Rechazada','bad'];
  return['Autorizada','ok'];
}

function tabCount(k){
  const R=S.role;
  if(R==='residente'&&k==='mis')return V().filter(r=>r.estado==='devuelta'&&isMine(r)).length;
  if(R==='compras'){
    if(k==='revisar')return V().filter(r=>r.estado==='compras').length;
    if(k==='oc')return allLines(elegCompras).length;
    if(k==='recibir')return allLines(elegRecep).length;
  }
  if(R==='residente'&&k==='nom')return Vn().filter(n=>n.estado==='elaboracion'&&n.devolucion).length;
  if(R==='administracion'&&k==='nomina')return Vn().filter(n=>n.estado==='enviada'||n.estado==='revision').length;
  if(R==='direccion'&&k==='nomaut')return Vn().filter(n=>n.estado==='direccion').length;
  if(R==='direccion'&&k==='excep')return excRows().filter(excIsPend).length;
  if(R==='direccion'&&k==='autorizar')return V().filter(r=>(r.estado==='direccion'||r.estado==='resuelta')&&L(r).some(l=>l.auth==='pendiente')).length;
  if(R==='administracion'){
    if(k==='revisar')return V().filter(r=>r.estado==='administracion').length;
    if(k==='pagar')return allLines(elegPagar).length;
    if(k==='credito')return allLines(elegCred).length;
  }
  return 0;
}
function statsHtml(){
  const st=(a,b,c)=>'<div class="stat"><span>'+a+'</span><b>'+b+'</b>'+(c?'<small>'+c+'</small>':'')+'</div>';
  const R=S.role;let h='';
  if(R==='residente'){
    const m=V().filter(isMine);
    h=st('Requisiciones',m.length,'creadas por usted')+st('Autorizado',money(sum(m.map(reqAut))),'por Dirección')+st('Pagado',money(sum(m.map(reqPag))),'con comprobante')+st('Devueltas',m.filter(r=>r.estado==='devuelta').length,'esperan su corrección');
  }else if(R==='compras'){
    const ev=ocEvents().filter(e=>e.fecha>=todayISO()&&e.fecha<=addDays(todayISO(),7));
    h=st('Por revisar',V().filter(r=>r.estado==='compras').length,'requisiciones nuevas')+st('Por generar OC',allLines(elegCompras).length,money(sum(allLines(elegCompras).map(x=>x.l.total))))+st('Entregas en 7 días',ev.length,'según fecha compromiso');
  }else if(R==='direccion'){
    const p=allLines((l,r)=>(r.estado==='direccion'||r.estado==='resuelta')&&l.auth==='pendiente');
    h=st('Por autorizar',V().filter(r=>(r.estado==='direccion'||r.estado==='resuelta')&&L(r).some(l=>l.auth==='pendiente')).length,p.length+' partidas')+st('Monto pendiente',money(sum(p.map(x=>x.l.total))),'por autorizar')+st('Autorizado',money(sum(V().map(reqAut))),'acumulado');
  }else{
    const pg=allLines(elegPagar),cr=allLines(elegCred);
    const espera=allLines(l=>l.auth==='autorizada'&&!l.oc).length;
    h=st('Por revisar',V().filter(r=>r.estado==='administracion').length,'gastos dirigidos a Administración')+st('Por pagar',money(sum(pg.map(x=>x.l.total))),pg.length+' partidas con OC resuelta')+st('Saldo a crédito',money(sum(cr.map(x=>saldo(x.l)))),cr.length+' partidas')+st('Pagado',money(sum(V().map(reqPag))),'acumulado')+(espera?st('Esperan OC',espera,'Compras aún no define OC'):'');
  }
  return '<div class="stats">'+h+'</div>';
}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

  const R=S.role,k=S.tab;

  if(k==='nueva')return formHtml();

  if(k==='prov'&&R!=='residente')return provHtml();
  if(k==='nom'&&R==='residente')return nomView();
  if(k==='nomina'&&R==='administracion')return nomView();

  if(R==='administracion'&&k==='revisar')return reqList(V().filter(r=>r.estado==='administracion'),'Nada por revisar','Los gastos que los residentes dirigen a Administración aparecen aquí. Después de revisarlos, usted los libera directo a Dirección.');
  if(R==='compras'&&k==='revisar')return reqList(V().filter(r=>r.estado==='compras'),'Nada por revisar','Las requisiciones nuevas de los residentes aparecen aquí.');
  if(R==='compras'&&k==='recibir')return lineTable(allLines(elegRecep),'No hay partidas por recibir','Aparecen aquí las partidas con OC generada que aún no tienen recepción registrada.');
  if(R==='compras'&&k==='oc')return lineTable(allLines(elegCompras),'No hay partidas autorizadas esperando OC','Cuando Dirección autorice partidas, aparecerán aquí para generar la OC o marcar “No aplica OC”.');
  if(R==='direccion'&&k==='autorizar')return reqList(V().filter(r=>(r.estado==='direccion'||r.estado==='resuelta')&&L(r).some(l=>l.auth==='pendiente')),'Nada por autorizar','Compras libera aquí las requisiciones revisadas.');
  if(R==='direccion'&&k==='resueltas')return reqList(V().filter(r=>r.estado==='resuelta'&&!L(r).some(l=>l.auth==='pendiente')),'Aún no hay requisiciones resueltas','');
  if(k==='todas')return reqList(V(),'Aún no hay requisiciones','');
  if(R==='administracion'&&k==='pagar')return lineTable(allLines(elegPagar),'No hay partidas por pagar','Aparecen aquí las partidas autorizadas cuyo trámite de OC ya quedó resuelto en Compras.');

  if(R==='administracion'&&k==='pagadas')return lineTable(allLines(l=>l.pago==='pagado'),'Aún no hay pagos registrados','',true);
  return '';
}

function lineChips(l,compact){

async function provSubmit(root,p){

  if(!v.alias)return 'Capture el alias o nombre comercial.';
  if(!v.rfc)return 'Capture el RFC del proveedor.';
  if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(v.rfc))return 'El RFC no tiene un formato válido (12 caracteres para persona moral, 13 para persona física).';
  if(!v.titular)return 'Capture el titular de la cuenta bancaria.';
  if(!v.banco)return 'Capture la institución bancaria.';
  if(!/^\d{18}$/.test(v.clabe))return 'La CLABE interbancaria debe tener exactamente 18 dígitos'+(v.clabe?' (capturó '+v.clabe.length+').':'.');

  if(dupR)return 'ALERTA DE DUPLICADO: el RFC '+v.rfc+' ya está registrado como “'+dupR.alias+'” ('+(ROLES[dupR.depto]||'')+'). No se permiten proveedores duplicados.';
  const dupC=S.provs.find(x=>(!p||x.id!==p.id)&&x.clabe===v.clabe);
  if(dupC)return 'ALERTA DE DUPLICADO: la CLABE '+mask(v.clabe)+' ya está registrada con “'+dupC.alias+'” ('+(ROLES[dupC.depto]||'')+'). No se permiten cuentas duplicadas.';
  const upC=csf?await uploadFile(csf):null,upB=bdoc?await uploadFile(bdoc):null;

  const bank=[];

  if(p.banco!==v.banco)bank.push('institución “'+p.banco+'” → “'+v.banco+'”');
  if(p.clabe!==v.clabe)bank.push('CLABE '+mask(p.clabe)+' → '+mask(v.clabe));
  const n=clone(p);let changed=false;
  if(ch.length){ph(n,'Modificó datos generales — '+ch.join('; '),'edicion');changed=true;}
  if(bank.length){ph(n,'Cambio de datos bancarios: '+bank.join('; '),'banco');changed=true;}
  if(p.activo!==v.activo){ph(n,'Cambió el estatus de '+(p.activo?'Activo':'Inactivo')+' a '+(v.activo?'Activo':'Inactivo'),'estatus');changed=true;}
  if(upC){ph(n,'Actualizó la Constancia de Situación Fiscal ('+upC.name+')','doc');n.csf=upC;changed=true;}
  if(upB){ph(n,'Actualizó el documento bancario ('+upB.name+')','doc');n.bdoc=upB;changed=true;}
  if(!changed)return true;

function empStats(e){

  S.noms.filter(n=>n.estado==='autorizada').forEach(n=>(n.lineas||[]).forEach(l=>{

  }));

function nomValidate(d){
  const dates=datesBetween(d.desde,d.hasta);
  if(S.role==='residente'&&!(d.obra||'').trim())return 'Capture la obra de la nómina.';
  if(!d.desde||!d.hasta||d.hasta<d.desde)return 'Indique un periodo válido (la fecha final no puede ser anterior a la inicial).';
  if(dates.length>31)return 'El periodo no puede ser mayor a 31 días.';
  if(!d.lineas.length)return 'Agregue al menos un trabajador.';
  const set=new Set(dates);
  for(const ln of d.lineas){
    for(const o of S.noms){
      if(o.id===d.id||o.estado==='rechazada'||o.estado==='elaboracion')continue;
      if(!(o.lineas||[]).some(x=>x.empId===ln.empId&&!x.rechazada))continue;

function lineDiff(a,b,dates){

  if((Number(a.aguinaldoDias)||0)!==(Number(b.aguinaldoDias)||0))o.push('aguinaldo '+(Number(a.aguinaldoDias)||0)+' → '+(Number(b.aguinaldoDias)||0)+' días');
  if(ca.bon!==cb.bon)o.push('bonos '+money(ca.bon)+' → '+money(cb.bon));
  if((a.nota||'')!==(b.nota||''))o.push('observaciones');

    else if(l.pago==='credito'){if(inRange(l.creditoDesde,from,to))out.push([l.creditoDesde||'','Crédito pendiente',r.folio,r.obra,l.clave,l.concepto,l.proveedor,oc,l.total,'','Crédito']);}
  }));
  out.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  return csvOf(['Fecha','Tipo','Requisición','Obra','Clave','Concepto','Proveedor','OC','Importe','Comprobante','Estatus'],out);

  /* edición de partida */
  editlinea(el){
    const r=reqById(el.dataset.id),l=L(r).find(x=>x.id===el.dataset.l);
    S.tmp=clone(l);
    modal({title:'Editar partida',html:lineFields(S.tmp,0,'modal'),ok:'Guardar cambios',noFocus:true,onOk:async()=>{
      const t=S.tmp;
      if(!t.clave.trim()||!t.concepto.trim())return 'La clave y el concepto son obligatorios.';
      if(!(Number(t.cant)>0)||!(Number(t.pu)>0))return 'Cantidad y precio unitario deben ser mayores a cero.';
      if(!t.justificacion.trim())return 'La justificación es obligatoria.';
      const prevExc=l.provExc?clone(l.provExc):null;
      const legacyOk=(!l.provId&&!l.provExc&&!t.provExc&&!t.provId&&t.proveedor===l.proveedor)||(!!l.provId&&t.provId===l.provId&&!t.provExc);
      const pe=provErr(t,0,legacyOk);if(pe)return pe;
      const antes=l.total,cantAntes=l.cant;
      if(!l.orig)l.orig={cant:l.cant,pu:l.pu,total:l.total};
      const antesPu=l.pu,antesProv=l.proveedor;
      Object.assign(l,t,{total:lt(t),orig:l.orig,h:l.h});
      if(l.provExc){
        const same=prevExc&&prevExc.nombre===l.provExc.nombre&&prevExc.just===l.provExc.just;
        if(same)l.provExc=prevExc;else{l.provExc={nombre:l.provExc.nombre,just:l.provExc.just,estado:'pendiente',solT:Date.now(),solUid:myId};lh(l,'Proveedor con excepción solicitado a Dirección: '+l.provExc.nombre+' — '+l.provExc.just);hist(r,'solicitó autorización de excepción para el proveedor “'+l.provExc.nombre+'” (partida '+l.clave+')');}
      }else if(prevExc){lh(l,'Excepción de proveedor retirada; proveedor: '+(l.proveedor||'—'));}
      lh(l,'Editada'+(cantAntes!==l.cant?': cantidad de '+cantAntes+' a '+l.cant:'')+(antesPu!==l.pu?'; precio unitario de '+money(antesPu)+' a '+money(l.pu):'')+(antesProv!==l.proveedor?'; proveedor de '+(antesProv||'-')+' a '+(l.proveedor||'-'):'')+'; importe '+money(l.total));
      hist(r,'editó la partida '+l.clave+(cantAntes!==l.cant?' (cantidad de '+cantAntes+' a '+l.cant+')':'')+(antes!==l.total?' (importe de '+money(antes)+' a '+money(l.total)+')':''));await save(r);return true;}});

    const n0=nomById(el.dataset.id);
    modal({title:'Rechazar nómina',html:'<div class="f"><label for="m-txt">Motivo <i>*</i></label><textarea id="m-txt"></textarea></div>',ok:'Rechazar',onOk:async root=>{
      const t=root.querySelector('#m-txt').value.trim();if(!t)return 'Escriba el motivo del rechazo.';
      const n=clone(n0);if(S.role!=='direccion'||n.estado!=='direccion')return 'Esta nómina ya no está pendiente.';
      n.estado='rechazada';n.motivo=t;mark(n,'direccion');nh(n,'rechazó la nómina: '+t);await saveNom(n);return true;}});
  },
  async nomreabrir(el){const n=clone(nomById(el.dataset.id));if(n.estado!=='rechazada'||n.creatorId!==myId)return;n.estado='elaboracion';n.devolucion='';nh(n,'reabrió la nómina rechazada para corregirla');S.nv=null;await saveNom(n);S.nd=nomDraftFrom(nomById(n.id));render();},

  /* proveedores */
  provnew(){if(!canCreateProv())return;modal({title:'Nuevo proveedor',html:provFormHtml(null),ok:'Guardar proveedor',wide:true,noFocus:true,onOk:root=>provSubmit(root,null)});},
  provver(el){const pv=provById(el.dataset.id);if(!pv)return;modal({title:'Expediente · '+pv.alias,html:provExp(pv),ok:'Cerrar',noCancel:true,noFocus:true,wide:true});},
  provedit(el){const pv=provById(el.dataset.id);if(!pv||!canEditProv(pv))return;closeModal();modal({title:'Editar proveedor',html:provFormHtml(pv),ok:'Guardar cambios',wide:true,noFocus:true,onOk:root=>provSubmit(root,pv)});},
  provdel(el){
    const pv=provById(el.dataset.id);if(!pv||!canDelProv(pv))return;
    const ln=provLinks(pv);
    if(ln.length){closeModal();setTimeout(()=>toast('No se puede eliminar a «'+(pv.alias||pv.razon)+'»: tiene '+ln.length+' partida(s) vinculada(s) a requisiciones, OC o pagos. Para dejar de usarlo, edítelo y márquelo como Inactivo; así se conserva el historial.'),60);return;}
    closeModal();
    setTimeout(()=>modal({title:'Eliminar proveedor',html:'<p style="margin:0">Se eliminará de forma <b>permanente</b> a <b>'+esc(pv.alias||pv.razon)+'</b> (RFC '+esc(pv.rfc||'—')+') junto con su expediente. No tiene requisiciones ni pagos vinculados. Esta acción no se puede deshacer.</p>',ok:'Eliminar definitivamente',onOk:async()=>{
      const i=S.provs.findIndex(x=>x.id===pv.id);
      if(provColl){try{await provColl.doc(pv.id).delete();}catch(er){return 'No se pudo eliminar: '+((er&&(er.message||er.code))||String(er));}}
      if(i>=0)S.provs.splice(i,1);
      bitWrite({accion:'proveedor_baja',usuarioId:'',userNom:pv.alias||pv.razon,txt:'Eliminó al proveedor '+(pv.alias||pv.razon)+' (RFC '+(pv.rfc||'—')+')'});
      S.open=null;render();return true;}}),60);
  },
  provopen(el,e){if(e&&e.preventDefault)e.preventDefault();closeModal();S.open=el.dataset.id;render();},
  excseg(el){S.excSeg=el.dataset.k;render();},
  excaut(el){
    const r=reqById(el.dataset.id),l=L(r).find(x=>x.id===el.dataset.l);if(!l||!l.provExc||l.provExc.estado!=='pendiente')return;
    modal({title:'Autorizar excepción de proveedor',html:'<p style="margin:0">Proveedor: <b>'+esc(l.provExc.nombre)+'</b><br><span class="muted">'+esc(l.provExc.just)+'</span></p><p class="muted" style="margin:0;font-size:13px">Aplica únicamente a esta partida de la requisición '+esc(r.folio)+'. No activa al proveedor en el catálogo.</p><div class="f"><label for="m-txt">Observaciones (opcional)</label><textarea id="m-txt"></textarea></div>',ok:'Autorizar excepción',onOk:async root=>{
      const o=root.querySelector('#m-txt').value.trim();Object.assign(l.provExc,{estado:'autorizada',decT:Date.now(),decUid:myId,obs:o});
      lh(l,'Excepción de proveedor autorizada ('+l.provExc.nombre+')'+(o?': '+o:''));hist(r,'autorizó la excepción del proveedor “'+l.provExc.nombre+'” (partida '+l.clave+')'+(o?': '+o:''));await save(r);return true;}});
  },
  excrech(el){
    const r=reqById(el.dataset.id),l=L(r).find(x=>x.id===el.dataset.l);if(!l||!l.provExc||l.provExc.estado!=='pendiente')return;
    modal({title:'Rechazar excepción de proveedor',html:'<p style="margin:0">Proveedor: <b>'+esc(l.provExc.nombre)+'</b><br><span class="muted">'+esc(l.provExc.just)+'</span></p><p class="muted" style="margin:0;font-size:13px">La requisición regresa al residente para que elija otro proveedor o ajuste la justificación.</p><div class="f"><label for="m-txt">Observaciones <i>*</i></label><textarea id="m-txt"></textarea></div>',ok:'Rechazar excepción',onOk:async root=>{
      const o=root.querySelector('#m-txt').value.trim();if(!o)return 'Escriba las observaciones del rechazo.';
      Object.assign(l.provExc,{estado:'rechazada',decT:Date.now(),decUid:myId,obs:o});
      lh(l,'Excepción de proveedor rechazada ('+l.provExc.nombre+'): '+o);hist(r,'rechazó la excepción del proveedor “'+l.provExc.nombre+'” (partida '+l.clave+'): '+o);
      if(r.estado==='compras'||r.estado==='administracion'||r.estado==='direccion'){r.estado='devuelta';r.devolucion='Excepción de proveedor rechazada por Dirección ('+l.provExc.nombre+'): '+o;r.devPor='Dirección';}
      await save(r);return true;}});
  },

  /* comentarios */
  coment(el){const t=$('cm-text').value.trim();if(!t)return;const r=reqById(el.dataset.id);hist(r,t,'comentario');save(r);},

  /* administración */
  pagar(){payModal('pago');},
  abono(){payModal('abono');},
  credito(){
    const picks=selectedPicks(elegPagar);if(!picks.length)return;
    modal({title:'Enviar a crédito',html:'<p style="margin:0">'+picks.length+' partida'+(picks.length===1?'':'s')+' por '+money(sum(picks.map(x=>x.l.total)))+' pasarán a la sección Crédito. Podrá liquidarlas después con comprobantes.</p>',ok:'Enviar a crédito',onOk:async()=>{
      picks.forEach(x=>{x.l.pago='credito';x.l.creditoDesde=todayISO();lh(x.l,'Enviada a crédito por '+money(x.l.total));});
      [...new Set(picks.map(x=>x.r))].forEach(r=>hist(r,'envió a crédito '+picks.filter(x=>x.r===r).length+' partida(s)'));
      picks.forEach(x=>S.sel.delete(key(x.r,x.l)));await saveMany(picks);return true;}});
  },

  /* demo */
  sample(){
    const mkP=(razon,alias,rfc,clabe,banco)=>{let q=S.provs.find(x=>x.rfc===rfc);if(!q){q={id:rid(),razon:razon,alias:alias,rfc:rfc,csf:{name:'constancia-situacion-fiscal.pdf',url:null},bdoc:null,titular:razon,banco:banco,clabe:clabe,depto:'compras',uid:myId,creado:Date.now(),activo:true,hist:[{t:Date.now(),uid:myId,rol:'Compras',txt:'Creó el proveedor “'+alias+'” (ejemplo)',tipo:'alta'}]};saveProv(q);}return q;};
    const P1=mkP('Vidrios del Sureste SA de CV','Vidrios del Sureste','VSU120304AB1','012180001234567891','BBVA'),P2=mkP('Aluminios Mérida SA de CV','Aluminios Mérida','AME090815CD2','014180005555666677','Santander'),P3=mkP('Selladores Industriales SA de CV','Selladores Industriales','SIN100220EF3','072180009999888871','Banorte');
    const mk=(clave,concepto,cant,pu,prov,just)=>({id:rid(),clave:clave,concepto:concepto,unidad:'pza',cant:cant,pu:pu,total:r2(cant*pu),proveedor:prov.alias,provId:prov.id,provSnap:snapProv(prov),justificacion:just,cot:null,auth:'pendiente',oc:null,pago:'pendiente'});
    const r={id:rid(),folio:'REQ-'+code(),creatorId:myId,estado:'compras',obra:'Ejemplo · Fachada suspendida',solicitante:'Residente de obra',fechaSol:todayISO(),fechaReq:addDays(todayISO(),10),creado:Date.now(),
      lineas:[mk('VID-TEM-10','Vidrio templado 10 mm claro',24,1850,P1,'Piezas para módulos del nivel 4'),mk('PER-AL-3','Perfil de aluminio cuerpo 3 pulgadas',60,420,P2,'Reposición por corte de montantes'),mk('SEL-SIL','Sellador de silicón estructural',30,185,P3,'Sellado perimetral de cristales')],hist:[]};
    hist(r,'creó la requisición de ejemplo y la envió a Compras');S.tab=TABS[S.role][0][0];save(r);
  }
};

function abonoModal(){
  const picks=selectedPicks(elegCred);if(!picks.length)return;
  const rowsH=picks.map(x=>'<div class="f"><label for="ab-'+x.l.id+'">'+esc(x.r.folio)+' · '+esc(x.l.clave)+' '+esc(x.l.concepto)+' <span class="muted">(saldo '+money(saldo(x.l))+')</span></label><input id="ab-'+x.l.id+'" type="number" min="0" max="'+saldo(x.l)+'" step="0.01" inputmode="decimal" data-abono="'+key(x.r,x.l)+'" value="'+saldo(x.l)+'"></div>').join('');
  modal({title:'Registrar abono a crédito',html:'<p style="margin:0" class="muted">Escriba cuánto abona a cada partida. Puede ser menos que el saldo; el resto sigue a crédito.</p>'+rowsH+
    '<div class="row"><b>Total del abono: <span id="ab-tot" class="mono">'+money(sum(picks.map(x=>saldo(x.l))))+'</span></b><button class="btn sm" type="button" data-act="abfull">Pagar saldos completos</button></div>'+
    '<div class="f"><label for="m-fecha">Fecha de pago</label><input id="m-fecha" type="date" value="'+todayISO()+'"></div>'+
    '<div class="f"><label for="m-file">Comprobante de pago <i>*</i></label><input id="m-file" type="file" accept=".pdf,.png,.jpg,.jpeg"></div>',
    ok:'Registrar abono',noFocus:true,onOk:async root=>{
      const file=root.querySelector('#m-file').files[0];
      const ins=[...root.querySelectorAll('input[data-abono]')];
      const amts=[];let err='';
      ins.forEach(i=>{const k=i.dataset.abono,v=r2(i.value);const pk=picks.find(x=>key(x.r,x.l)===k);
        if(i.value!==''&&(isNaN(v)||v<0))err='Hay un monto inválido.';
        else if(v>saldo(pk.l)+0.005)err='El abono de '+pk.l.clave+' no puede ser mayor a su saldo ('+money(saldo(pk.l))+').';
        else if(v>0)amts.push({p:pk,v:v});});
      if(err)return err;
      if(!amts.length)return 'Escriba el monto de al menos una partida.';
      if(!file)return 'Suba el comprobante de pago.';
      const fecha=root.querySelector('#m-fecha').value||todayISO();
      const up=await uploadFile(file);
      amts.forEach(a=>{const l=a.p.l;(l.abonos=l.abonos||[]).push({fecha:fecha,monto:a.v,comprobante:up});lh(l,'Abono de '+money(a.v)+' (comprobante '+file.name+')');
        if(saldo(l)<=0.005){l.pago='pagado';l.pagoInfo={fecha:fecha,tipo:'abono',comprobante:up};}});
      [...new Set(amts.map(a=>a.p.r))].forEach(r=>{const m=amts.filter(a=>a.p.r===r);hist(r,'registró un abono de '+money(sum(m.map(a=>a.v)))+' en '+m.length+' partida(s) con comprobante '+file.name);});
      amts.forEach(a=>S.sel.delete(key(a.p.r,a.p.l)));await saveMany(amts.map(a=>a.p));return true;}});
}
function payModal(tipo){
  if(tipo==='abono')return abonoModal();
  const picks=selectedPicks(tipo==='pago'?elegPagar:elegCred);if(!picks.length)return;
  const tot=sum(picks.map(x=>x.l.total));
  modal({title:tipo==='pago'?'Registrar pago':'Registrar abono a crédito',html:
    '<p style="margin:0">'+picks.length+' partida'+(picks.length===1?'':'s')+' por <b>'+money(tot)+'</b>. Al subir el comprobante quedan como Pagado y el residente lo verá reflejado.</p>'+
    '<div class="f"><label for="m-fecha">Fecha de pago</label><input id="m-fecha" type="date" value="'+todayISO()+'"></div>'+
    '<div class="f"><label for="m-file">Comprobante de pago <i>*</i></label><input id="m-file" type="file" accept=".pdf,.png,.jpg,.jpeg"></div>',
    ok:'Marcar como pagado',noFocus:true,onOk:async root=>{
      const file=root.querySelector('#m-file').files[0];if(!file)return 'Suba el comprobante de pago.';
      const fecha=root.querySelector('#m-fecha').value||todayISO();
      const up=await uploadFile(file);
      picks.forEach(x=>{x.l.pago='pagado';x.l.pagoInfo={fecha:fecha,tipo:tipo,comprobante:up};lh(x.l,'Pagada por '+money(x.l.total)+' (comprobante '+file.name+')');});
      [...new Set(picks.map(x=>x.r))].forEach(r=>hist(r,(tipo==='pago'?'registró el pago de ':'registró un abono que liquida ')+picks.filter(x=>x.r===r).length+' partida(s) con comprobante '+file.name));
      picks.forEach(x=>S.sel.delete(key(x.r,x.l)));await saveMany(picks);return true;}});
}

/* ───────── eventos ───────── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='close'&&el.id!=='ov'&&e.target!==el&&el.tagName!=='BUTTON')return;
  if(el.tagName==='INPUT')return;
  if(S.auth==='loading'||S.auth==='denied'||S.auth==='inactive')return;
  const fn=A[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='role-sel'){if(!(S.mode==='local'||S.auth==='owner'))return;S.role=el.value;S.ownerRole=el.value;try{localStorage.setItem('gp_role',S.role);}catch(x){}if(S.mode==='cloud'){applyAccess(true);return;}S.tab=TABS[S.role][0][0];S.open=null;S.sel.clear();render();return;}
  if(el.dataset&&el.dataset.uf){S.uEst=el.value;const b=$('u-body');if(b)b.innerHTML=usersBody();return;}
  if(el.dataset&&el.dataset.bita){S.bA=el.value;const b=$('bit-body');if(b)b.innerHTML=bitBody();return;}
  if(el.id==='rp-q'){return;}
  if(el.dataset&&el.dataset.rcf){S.f[el.dataset.rcf]=el.value;refreshReport();return;}
  if(el.dataset&&el.dataset.nomf){S.nomF=el.value;render();return;}
  if(el.dataset&&el.dataset.nf){nomInput(el);return;}
  if(el.dataset&&(el.dataset.nh==='desde'||el.dataset.nh==='hasta')){nomInput(el);const d=S.nd,dt=datesBetween(d.desde,d.hasta);d.lineas.forEach(l=>{dt.forEach(x=>{if(!l.dias[x])l.dias[x]=defaultDia(x,l);});});render();return;}
  if(el.dataset&&el.dataset.pvf){S[el.dataset.pvf]=el.value;const b=$('pv-body');if(b)b.innerHTML=provBody();return;}
  if(el.id==='rp-from'||el.id==='rp-to'){if(el.id==='rp-from')S.rpFrom=el.value;else S.rpTo=el.value;refreshReport();return;}
  if(el.dataset&&el.dataset.act==='pdfsel'){const st=S.pdf.sel[S.pdf.tipo];if(el.checked)st.add(el.dataset.k);else st.delete(el.dataset.k);render();return;}
  if(el.name==='dest'&&S.draft){S.draft.destino=el.value;render();return;}
  if(el.matches&&el.matches('input[type=checkbox][data-act="sel"]')){A.sel(el);return;}
  if(el.dataset&&el.dataset.file){
    const scope=el.dataset.scope,i=Number(el.dataset.i),f=el.files[0];if(!f)return;
    const lab=$('cotn-'+scope+i);if(lab)lab.textContent='Subiendo…';
    uploadFile(f).then(u=>{
      if(scope==='draft'){S.draft.lineas[i].cot=u;}else if(scope==='modal'){S.tmp.cot=u;}
      const lb=$('cotn-'+scope+i);if(lb)lb.textContent=u.name;
    });
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='rp-q'){S.rpQ=el.value;refreshReport();return;}
  if(el.id==='u-q'){S.uq=el.value;const b=$('u-body');if(b)b.innerHTML=usersBody();return;}
  if(el.id==='bit-q'){S.bq=el.value;const b=$('bit-body');if(b)b.innerHTML=bitBody();return;}
  if(el.id==='emp-q'){S.empQ=el.value;const b=$('emp-body');if(b)b.innerHTML=empBody();return;}
  if(el.dataset&&(el.dataset.nh||el.dataset.nf)){nomInput(el);return;}
  if(el.id==='pv-q'){S.pvQ=el.value;S.pvq=el.value;const b=$('pv-body');if(b)b.innerHTML=provBody();return;}
  if(el.dataset&&el.dataset.abono){const t=$('ab-tot');if(t)t.textContent=money(sum([...document.querySelectorAll('input[data-abono]')].map(i=>r2(i.value))));return;}
  const sc=el.dataset&&el.dataset.scope;if(!sc||el.dataset.file)return;
  const f=el.dataset.f;let tgt;
  if(sc==='head'){S.draft[f]=el.value;return;}
  if(sc==='draft')tgt=S.draft.lineas[Number(el.dataset.i)];
  else if(sc==='modal')tgt=S.tmp;
  if(!tgt)return;
  if(f==='provq'){setProv(tgt,el.value);const b=$('pb-'+sc+el.dataset.i);if(b)b.innerHTML=provDetail(tgt,sc,el.dataset.i);return;}
  if(f==='excNombre'||f==='excJust'){if(tgt.provExc){tgt.provExc[f==='excNombre'?'nombre':'just']=el.value;if(f==='excNombre')tgt.proveedor=el.value;}return;}
  tgt[f]=(f==='cant'||f==='pu')?(el.value===''?'':Number(el.value)):el.value;
  if(f==='cant'||f==='pu'){
    const t=document.querySelector('[data-total="'+sc+el.dataset.i+'"]');if(t)t.value=money(lt(tgt));
    if(sc==='draft'){const dt=$('draft-total');if(dt)dt.innerHTML='Total de la requisición: <b class="mono">'+money(sum(S.draft.lineas.map(lt)))+'</b>';}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(curModal)closeModal();else if(S.open){S.open=null;render();}
});

/* ───────── arranque ───────── */
async function boot(){
  render();
  try{
    if(typeof claude!=='undefined'&&claude.use){
      db=await claude.use('db');user=await claude.use('user');assets=await claude.use('assets');
    }
  }catch(e){}
  if(db){
    S.mode='cloud';
    try{if(user&&user.id){myId=(await user.id())||'anon';}}catch(e){myId='anon';}
    let me=null;try{me=user&&user.me?await user.me():null;}catch(e){}
    S.myEmail=String((me&&(me.email||me.emailAddress))||'').trim().toLowerCase();S.myName=(me&&me.name)||'';
    try{S.isOwner=!!(user&&user.isOwner&&user.isOwner());}catch(e){S.isOwner=false;}
    coll=db.collection('requisiciones');
    try{auditColl=db.collection('auditoria_reportes');}catch(e){auditColl=null;}
    try{provColl=db.collection('proveedores');}catch(e){provColl=null;}
    try{empColl=db.collection('empleados');}catch(e){empColl=null;}
    try{nomColl=db.collection('nominas');}catch(e){nomColl=null;}
    try{usersColl=db.collection('usuarios');bitColl=db.collection('bitacora_seguridad');}catch(e){usersColl=null;bitColl=null;}
    S.auth='loading';
    subUsers(false);
    if(S.isOwner)applyAccess();
  }else{
    S.mode='local';S.auth='ok';S.ready=true;render();
  }
}
boot();
})();
