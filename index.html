  const bn=(t,d)=>'<div class="alarma" role="alert"><div class="alarma-t">⚠ '+t+'</div><div class="alarma-d">'+d+'</div></div>';
  return (o.fia.length?bn('REVISAR FIANZAS · SE SALE DE PERIODO','La nueva fecha de término del contrato ('+fdate(fin)+') rebasa la vigencia de: '+o.fia.map(f=>esc(f.tipo+' · '+f.afianzadora+' (vence '+fdate(f.fin)+')')).join('; ')+'. Tramite la ampliación de la fianza.'):'')+
   (o.sir?bn('REVISAR SIROC · SE SALE DE PERIODO','La nueva fecha de término del contrato ('+fdate(fin)+') es posterior a la terminación estimada registrada en SIROC ('+fdate(o.sir.fTerm)+'). Actualice el registro de la obra ante el IMSS.'):'');
}

  let y=pdfHead(doc,'Reporte del proyecto: '+p.nombre,'Cliente: '+(p.cliente||'-')+'  |  Ubicación: '+(p.ubicacion||'-'));
  const sec=t=>{if(y>H-40){doc.addPage();y=20;}doc.setTextColor(11,95,122);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(pdfT(t),14,y);doc.setDrawColor(11,95,122);doc.line(14,y+1.5,202,y+1.5);doc.setTextColor(20,35,43);y+=8;};

  const vacio=t=>{doc.setFont('helvetica','italic');doc.setFontSize(9.5);doc.text(pdfT(t),14,y);doc.setFont('helvetica','normal');y+=8;};
  const R={halign:'right'};
  info([['Proyecto',p.nombre],['Cliente',p.cliente||'-'],['Ubicación',p.ubicacion||'-'],['Alta del proyecto',who(p.uid,p.creado)]]);

    const par=(t,d)=>{const L=doc.splitTextToSize(pdfT(d),182);if(y+L.length*5+10>H-20){doc.addPage();y=20;}doc.setTextColor(180,35,24);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(pdfT(t),14,y);y+=5.5;doc.setTextColor(20,35,43);doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(L,14,y);y+=L.length*4.6+4;};
    if(o.fia.length)par('REVISAR FIANZAS - SE SALE DE PERIODO',o.fia.map(f=>f.tipo+' '+f.afianzadora+' (vence '+fdate(f.fin)+')').join('; ')+'. Vencen antes de la fecha de término vigente del contrato ('+fdate(finEff(p))+').');

  sec('Contrato');
  if(!c)vacio('Sin contrato registrado.');
  else{
    info([['Archivo del contrato',fn(c.file)],['Cargado',who(c.uid,c.t)],['Fecha de inicio',fdate(c.ini)],['Fecha de término original',fdate(c.fin)],['Periodo de ejecución',c.dias+' días naturales'],['Monto total original',money(c.monto)],['Anticipo ('+c.pa+'%)',money(c.anticipo)],['Fondo de garantía ('+c.pf+'%)',money(c.fondo)]]);

  if(f==='provq'){setProv(tgt,el.value);const b=$('pb-'+sc+el.dataset.i);if(b)b.innerHTML=provDetail(tgt,sc,el.dataset.i);return;}
  if(f==='excNombre'||f==='excJust'){if(tgt.provExc){tgt.provExc[f==='excNombre'?'nombre':'just']=el.value;if(f==='excNombre')tgt.proveedor=el.value;}return;}
  if(f==='paqm'){const v=Number(el.value);tgt.paq=v>0?{monto:r2(v),estimado:true}:null;const t=document.querySelector('[data-total="'+sc+el.dataset.i+'"]');if(t)t.value=money(lt(tgt));return;}
  tgt[f]=(f==='cant'||f==='pu')?(el.value===''?'':Number(el.value)):el.value;
  if(f==='cant'||f==='pu'){
    const t=document.querySelector('[data-total="'+sc+el.dataset.i+'"]');if(t)t.value=money(lt(tgt));
    if(sc==='draft'){const dt=$('draft-total');if(dt)dt.innerHTML='Total de la requisición: <b class="mono">'+money(sum(S.draft.lineas.map(lt)))+'</b>';}
  }
});
document.addEventListener('wheel',e=>{const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.type==='number')a.blur();},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(curModal)closeModal();else if(S.open){S.open=null;render();}
});

/* ───────── arranque ───────── */
async function boot(){
  render();
  try{
    if(typeof claude!=='undefined'&&claude.use){
      db=await claude.use('db');user=await claude.use('user');assets=await claude.use('assets');
    }
  }catch(e){}
  if(db){
    S.mode='cloud';
    try{if(user&&user.id){myId=(await user.id())||'anon';}}catch(e){myId='anon';}
    let me=null;try{me=user&&user.me?await user.me():null;}catch(e){}
    S.myEmail=String((me&&(me.email||me.emailAddress))||'').trim().toLowerCase();S.myName=(me&&me.name)||'';
    try{S.isOwner=!!(user&&user.isOwner&&user.isOwner());}catch(e){S.isOwner=false;}
    coll=db.collection('requisiciones');
    try{auditColl=db.collection('auditoria_reportes');}catch(e){auditColl=null;}
    try{provColl=db.collection('proveedores');}catch(e){provColl=null;}
    try{empColl=db.collection('empleados');}catch(e){empColl=null;}
    try{nomColl=db.collection('nominas');}catch(e){nomColl=null;}
    try{proyColl=db.collection('proyectos');}catch(e){proyColl=null;}
    try{tarColl=db.collection('tareas');anColl=db.collection('anuncios');anEntColl=db.collection('anuncios_enterados');}catch(e){anColl=null;anEntColl=null;}
    try{altasColl=db.collection('altas_trabajadores');expColl=db.collection('expedientes_trabajadores');}catch(e){altasColl=null;expColl=null;}
    try{repColl=db.collection('reposiciones');}catch(e){repColl=null;}
    try{docsColl=db.collection('documentos');notifColl=db.collection('notificaciones');lecColl=db.collection('notif_lecturas');}catch(e){docsColl=null;notifColl=null;lecColl=null;}
    try{usersColl=db.collection('usuarios');bitColl=db.collection('bitacora_seguridad');}catch(e){usersColl=null;bitColl=null;}
    S.auth='loading';
    subUsers(false);
    if(S.isOwner)applyAccess();
  }else{
    S.mode='local';S.auth='ok';S.ready=true;render();
  }
}
boot();
})();
</script>
