<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROL 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior con rol, pestañas por rol, lista de requisiciones y panel lateral de detalle. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#f7f9fa; --ink:#14232b; --muted:#5b6c74; --line:#d8e0e3;
  --accent:#0b5f7a; --accent-ink:#ffffff; --accent-soft:#e0eff4;
  --ok:#1b7447; --ok-soft:#e0f2e8; --warn:#8f5206; --warn-soft:#fcefd6;
  --bad:#a8261f; --bad-soft:#fae3e1; --info:#3d4fa3; --info-soft:#e7eaf9;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,35,43,.06),0 4px 14px rgba(20,35,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --surface:#17252c; --surface-2:#1c2c34; --ink:#e6eef1; --muted:#9bb0b8; --line:#2b3d46;
    --accent:#5cc0de; --accent-ink:#0b1b21; --accent-soft:#183a47;
    --ok:#62d093; --ok-soft:#163a29; --warn:#f0b35a; --warn-soft:#3d2d12;
    --bad:#ff8f87; --bad-soft:#442220; --info:#9eb0ff; --info-soft:#232b52;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17252c; --surface-2:#1c2c34; --ink:#e6eef1; --muted:#9bb0b8; --line:#2b3d46;
  --accent:#5cc0de; --accent-ink:#0b1b21; --accent-soft:#183a47;
  --ok:#62d093; --ok-soft:#163a29; --warn:#f0b35a; --warn-soft:#3d2d12;
  --bad:#ff8f87; --bad-soft:#442220; --info:#9eb0ff; --info-soft:#232b52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}

/* campana de notificaciones */
.bellw{position:relative;margin-left:auto}
.bell{position:relative;font-size:16px;padding:6px 12px}
#bell-n{background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
.npop{position:absolute;right:0;top:calc(100% + 8px);width:min(400px,92vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:40}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:none;margin:0;padding:10px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:18px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600;color:var(--ink)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{position:sticky;top:var(--topH,57px);height:calc(100vh - var(--topH,57px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px}
.side-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.menu-btn{display:none}
.side-ov{display:none}
.nav button{background:none;border:0;border-left:3px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;font-size:14.5px}
.nav .nav-g{font-weight:700;color:var(--ink);border-left-color:transparent;margin-top:6px;font-size:14px;letter-spacing:.01em}
.nav .nav-i{padding-left:26px;font-size:14px}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.badge.new::after{content:" Nuevo";font-weight:600}

main{width:100%;min-width:0;max-width:none;margin:0;padding:18px 24px 80px;display:flex;flex-direction:column;gap:16px}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat small{font-size:12px;color:var(--muted)}

h2.sec{font-size:15px;margin:4px 0 0;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.req{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,box-shadow .15s}
.req:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.req-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.folio{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.req-title{font-weight:600;font-size:16px}
.req-meta{font-size:13px;color:var(--muted)}
.req-amt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.req-amt b{font-size:18px;font-variant-numeric:tabular-nums}
.req-amt small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-info{background:var(--info-soft);color:var(--info)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:52ch}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* formularios */
.form{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.f input[readonly]{background:var(--surface-2);font-weight:600}
.lcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lcard-h{display:flex;justify-content:space-between;align-items:center}
.lcard-h b{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.file-line{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.file-line input[type=file]{display:none}

/* destino */
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:520px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt{align-items:center;font-size:16px}
.f .opt input{width:auto;flex:none;margin:0}
.opt span{display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:12.5px}
/* tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--surface-2);font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:12px;color:var(--muted);margin-top:2px;max-width:42ch}
td .rej{font-size:12px;color:var(--bad);margin-top:2px}
.grp{background:var(--surface-2);font-weight:600}
.grp td{padding:8px 10px}

/* panel lateral */
.tarav-box{background:#fff;border:8px solid #E65100;border-radius:18px;max-width:760px;width:100%;padding:36px 32px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.55)}
#tarav{position:fixed;inset:0;z-index:290;background:rgba(40,40,40,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.tarav-box h1{font-size:clamp(30px,6vw,56px);line-height:1.1;margin:18px 0 10px;color:#BF360C}
.tarav-ven{font-size:clamp(20px,3vw,30px);font-weight:800;color:#C62828;margin-bottom:6px}.tarav-sub{font-size:clamp(16px,2.4vw,24px);color:#444;margin-bottom:24px}
.anun{}#anun{position:fixed;inset:0;z-index:300;background:rgba(120,10,10,.92);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.anun-box{background:#fff;border:8px solid #C62828;border-radius:18px;max-width:900px;width:100%;padding:36px 32px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.6);animation:anpulse 1.6s ease-in-out infinite}
.anun-tag{display:inline-block;background:#C62828;color:#fff;font-weight:800;letter-spacing:.12em;padding:8px 18px;border-radius:999px;font-size:15px}
.anun-box h1{font-size:clamp(28px,5vw,52px);line-height:1.1;margin:18px 0 14px;color:#8E0000}
.anun-txt{font-size:clamp(18px,2.6vw,28px);line-height:1.4;color:#1b1b1b;margin:0 0 18px;text-align:left;white-space:normal}
.anun-by{color:#666;font-size:14px;margin-bottom:22px}
.anun-btn{background:#C62828;color:#fff;border:0;border-radius:14px;font-size:clamp(22px,3vw,34px);font-weight:800;padding:18px 56px;cursor:pointer;letter-spacing:.06em}
.anun-btn:hover{background:#9f1f1f}.anun-hint{color:#8E0000;font-size:13px;margin:12px 0 0}
@keyframes anpulse{0%,100%{box-shadow:0 20px 80px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 10px rgba(255,255,255,.35),0 20px 80px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){.anun-box{animation:none}}
.ov{position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1500px,100%);background:var(--bg);z-index:41;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.drawer.on{display:flex}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dr-head h3{margin:0;font-size:24px}
.dr-body table{font-size:15px}
.dr-body td,.dr-body th{padding:12px 14px}
.dr-body td:nth-child(2),.dr-body td:nth-child(3){min-width:0}
.dr-body .mono{white-space:nowrap}
.orig{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;margin-right:8px;font-weight:500}
.dr-body td:nth-child(3),.dr-body td:nth-child(2){min-width:140px}
.dr-body td .sub{max-width:60ch;font-size:13px}
.dr-body .kv div b{font-size:17px}
.dr-body{overflow-y:auto;padding:20px 28px 48px;font-size:15.5px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-variant-numeric:tabular-nums}
.note{border-radius:10px;padding:10px 14px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.selbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);z-index:5}
.selbar b{margin-right:auto}
.hist{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-size:12px}
.hist .who{font-weight:600}
.hist .coment{background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:4px}

/* modal */
.mo{position:fixed;inset:0;background:rgba(10,20,25,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:92%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mb-h{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.mb-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mb-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* calendario */
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h h2{margin:0;font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dow{background:var(--surface-2);padding:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.off{background:var(--surface-2);opacity:.6}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink)}
.dn{font-size:12px;font-weight:600;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ev{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.95);text-decoration:underline}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:13.5px}
.mb.wide{width:min(920px,100%)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.folder{display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s,border-color .12s}
.folder:hover,.folder:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#E8B800}
.folder-ic{width:76%;max-width:190px;margin:0 auto 6px}
.folder-ic.sm{width:120px;max-width:none;margin:0;flex:none}
.folder-t{font-weight:700;font-size:16px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.folder-m{font-size:13.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.folder-m b{color:var(--text,inherit);font-weight:600}
.calc{height:44px;box-sizing:border-box;display:flex;align-items:center;padding:0 14px;border:1px dashed var(--line);border-radius:10px;background:var(--bg,#f4f5f7);font-weight:700}
.folder-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mb-b .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;align-items:end}
.mb-b .grid>.f{justify-content:flex-end}
.mb-b .grid>.f.span2{grid-column:span 2}
.mb-b .grid>.f.full{grid-column:1/-1}
.mb-b .f label{line-height:1.25}
.mb-b .f input:not([type=checkbox]):not([type=file]),.mb-b .f select{height:44px;box-sizing:border-box}
.mb-b .dias{display:flex;flex-wrap:wrap;gap:8px}
.mb-b .dias .opt{padding:8px 14px;font-size:15px;border-radius:10px;gap:8px;border-width:1.5px}
.mb-b .dias .opt input{width:18px;height:18px}
.mb-b .hint{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
@media(max-width:720px){.mb-b .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mb-b .grid>.f.span2{grid-column:1/-1}}
@media(max-width:480px){.mb-b .grid{grid-template-columns:1fr}}
.ev.pj-ini{background:#dff3e4;color:#1d6b38;border-left:3px solid #2f8f4e}
.ev.pj-fin{background:#fbe0e0;color:#9a2a1f;border-left:3px solid #c0392b}
.ev.pj-fia{background:#e4ecfb;color:#24478f;border-left:3px solid #3b6fd4}
.ev.pj-fiaf{background:#ece3fa;color:#5b2b9a;border-left:3px solid #7b4fd1}
.saldos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.saldo{background:#e3f6e8;border:1px solid #9fd8b0;border-radius:12px;padding:16px 18px;color:#14532d}
.saldo .l{font-size:14px;font-weight:600}.saldo b{display:block;font-size:26px;margin-top:4px}.saldo .s{font-size:12.5px;margin-top:4px;opacity:.85}
.saldo.neg{background:#fde4e1;border-color:#e8a29a;color:#8a1f13}
.alarma{background:#b42318;color:#fff;border-radius:14px;padding:22px 26px;margin:14px 0;box-shadow:0 0 0 4px #fbd0cb;animation:alarma 1.6s ease-in-out infinite}
.alarma-t{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.3px;line-height:1.15}.alarma-d{margin-top:8px;font-size:15px;font-weight:600}
@keyframes alarma{50%{box-shadow:0 0 0 8px #f4a79e}}@media(prefers-reduced-motion:reduce){.alarma{animation:none}}
.ct-big .card{padding:24px}.ct-big .card b{font-size:21px!important}.ct-big .card .muted{font-size:14px}.ct-big .card .grid{gap:22px}
.ev.pj-sir{background:#d9f2f0;color:#0d5c57;border-left:3px solid #159a92}

<body>

<script>
(function(){
'use strict';

/* ───────── utilidades ───────── */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const sum=a=>Math.round(a.reduce((x,y)=>x+(Number(y)||0),0)*1e6)/1e6;
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fstamp=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const code=()=>{const d=new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.random().toString(36).slice(2,5).toUpperCase();};
const clone=o=>JSON.parse(JSON.stringify(o));

const ROLES={residente:'Residente',auditor:'Auditor',compras:'Compras',direccion:'Dirección',administracion:'Administración',sistemas:'Sistemas'};
const TABS={
  sistemas:[['usuarios','Usuarios y permisos'],['depurar','Eliminar registros'],['anuncios','Anuncios'],['bitacora','Bitácora de seguridad'],['tareasm','Tareas asignadas'],['notif','Notificaciones']],
  residente:[['mis','Mis gastos'],['nueva','Nuevo gasto'],['repos','Reposiciones'],['nom','Nómina'],['altas','Altas de personal'],['cal','Calendario'],['rep','Reportes'],['tareasm','Tareas asignadas'],['herr_vanos','Levantamiento de vanos'],['notif','Notificaciones']],
  auditor:[['revisar','Por auditar'],['todas','Todas'],['cal','Calendario'],['tareas','Tareas (asignar)'],['tareasm','Tareas asignadas'],['rep','Reportes'],['notif','Notificaciones']],
  compras:[['mis','Mis requisiciones'],['nueva','Nueva requisición'],['revisar','Por revisar'],['excep','Excepciones'],['oc','Por generar OC'],['recibir','Por recibir'],['ocs','OC y entregas'],['todas','Todas'],['repos','Reposiciones'],['prov','Proveedores'],['rep','Reportes'],['tareasm','Tareas asignadas'],['notif','Notificaciones']],
  direccion:[['autorizar','Por autorizar'],['nomaut','Nómina'],['altas','Altas y bajas'],['resueltas','Resueltas'],['repos','Reposiciones'],['cal','Calendario'],['todas','Todas'],['prov','Proveedores'],['tareas','Seguimiento de tareas'],['tareasm','Tareas asignadas'],['rep','Reportes'],['notif','Notificaciones']],
  administracion:[['proy','Proyectos'],['revisar','Por revisar'],['excep','Excepciones'],['pagar','Por pagar'],['credito','Crédito'],['pagadas','Pagadas'],['repos','Reposiciones'],['nomina','Nómina'],['emps','Empleados'],['altas','Altas y bajas'],['cal','Calendario'],['prov','Proveedores'],['rep','Reportes'],['tareasm','Tareas asignadas'],['notif','Notificaciones']]
};

/* ───────── estado ───────── */
const S={reqs:[],role:'residente',tab:'mis',open:null,sel:new Set(),cal:new Date(),ready:false,mode:'local',draft:null,tmp:null};
let db=null,user=null,assets=null,coll=null,myId='local';
try{const r=localStorage.getItem('gp_role');if(r&&ROLES[r])S.role=r;}catch(e){}
S.tab=TABS[S.role][0][0];if(S.role==='compras')S.tab='revisar';

/* ───────── datos ───────── */
function rows(snap){
  const val=d=>{const v=typeof d.data==='function'?d.data():d.data;return JSON.parse(JSON.stringify(Object.assign({id:d.id},v||d)));};
  if(Array.isArray(snap))return snap.map(val);
  if(snap&&snap.docs)return snap.docs.map(val);
  const out=[];if(snap&&snap.forEach)snap.forEach(d=>out.push(val(d)));return out;
}
function sortReqs(){S.reqs.sort((a,b)=>(b.creado||0)-(a.creado||0));}
async function save(r){
  r.upd=Date.now();
  const copy=clone(r);
  try{const sk='r'+r.id;ndiffReq(SNAP[sk]?JSON.parse(SNAP[sk].j):null,copy);snapPut(sk,copy);}catch(e){}
  const i=S.reqs.findIndex(x=>x.id===r.id);
  if(i>=0)S.reqs[i]=copy;else S.reqs.push(copy);
  sortReqs();
  render();
  if(coll){
    const ref=coll.doc(r.id);let err=null;
    try{await ref.set(copy);}catch(e1){
      err=e1;
      try{await ref.update(copy);err=null;}catch(e2){err=e2;}
    }
    if(err){S.saveErr='No se pudo guardar en la base compartida: '+((err&&(err.message||err.code))||String(err));setTimeout(()=>toast(S.saveErr),50);}
  }
}
function toast(t){modal({title:'Aviso',html:'<p style="margin:0">'+esc(t)+'</p>',ok:'Entendido',noCancel:true});}
function hist(r,txt,tipo){(r.hist=r.hist||[]).push({t:Date.now(),uid:myId,rol:ROLES[S.role],txt:txt,tipo:tipo||'evento'});}
function lh(l,txt){(l.h=l.h||[]).push({t:Date.now(),uid:myId,rol:ROLES[S.role],txt:txt});}
function lhAll(r,txt){L(r).forEach(l=>lh(l,txt));}
function mark(r,k){(r.revision=r.revision||{})[k]={uid:myId,t:Date.now()};}

/* ───────── cálculos ───────── */
const L=r=>r.lineas||[];
const paqM=l=>(l&&l.paq&&Number(l.paq.monto)>0)?Number(l.paq.monto):0;
const PAQ_LIM=1000;
const lt=l=>r2((Number(l.cant)||0)*(Number(l.pu)||0)+paqM(l));
const reqTotal=r=>r2(sum(L(r).map(l=>l.total)));
const reqAut=r=>r2(sum(L(r).filter(l=>l.auth==='autorizada').map(l=>l.total)));
const abonado=l=>l.abonos&&l.abonos.length?r2(sum(l.abonos.map(a=>a.monto))):(l.pago==='pagado'?r2(l.total):0);
const saldo=l=>l.pago==='pagado'?0:r2(Math.max(0,(Number(l.total)||0)-(l.abonos?abonado(l):0)));
const reqPag=r=>r2(sum(L(r).map(l=>l.pago==='pagado'?l.total:(l.abonos?abonado(l):0))));
const key=(r,l)=>r.id+'|'+l.id;
function allLines(fn){const o=[];V().forEach(r=>L(r).forEach(l=>{if(fn(l,r))o.push({r:r,l:l});}));return o;}
function statusOf(r){
  const ls=L(r);
  if(r.estado==='elaboracion')return['En elaboración','mute'];
  if(r.estado==='auditoria')return['En revisión de Auditoría','info'];
  if(r.estado!=='devuelta'&&L(r).some(l=>l.provExc&&l.provExc.estado==='pendiente'))return['Pendiente de autorización de excepción por '+excWho(r),'warn'];
  if(r.estado==='compras')return['Enviada a Compras','info'];
  if(r.estado==='administracion')return['En revisión por Administración','info'];
  if(r.estado==='devuelta')return['Devuelta al residente','warn'];
  if(r.estado==='direccion')return['Pendiente de autorización de Dirección','info'];
  const pend=ls.filter(l=>l.auth==='pendiente').length;
  const aut=ls.filter(l=>l.auth==='autorizada');
  const rech=ls.filter(l=>l.auth==='rechazada').length;
  const comp=aut.filter(l=>!l.bodega);
  if(aut.length&&!comp.length&&!pend)return['Autorizada · material en bodega','ok'];
  if(comp.length&&comp.every(l=>l.pago==='pagado')&&!pend)return['Pagada','ok'];
  if(pend&&aut.length)return['Autorizada parcial','warn'];
  if(pend)return['Pendiente de autorización de Dirección','info'];
  if(rech===ls.length)return['Rechazada','bad'];
  return['Autorizada','ok'];
}
const pill=(t,tone)=>'<span class="pill t-'+tone+'">'+esc(t)+'</span>';
const isMine=r=>r.creatorId===myId;
const V=()=>S.reqs.filter(r=>r.estado==='elaboracion'?isMine(r):(S.role==='residente'?isMine(r):true));
const DEST={compras:'Compras',administracion:'Administración'};
const destOf=r=>r.destino||'compras';
S.names={};
async function loadNames(ids){
  if(!user||!user.profiles)return;
  const need=[...new Set(ids)].filter(i=>i&&!(i in S.names));if(!need.length)return;
  need.forEach(i=>{S.names[i]='';});
  try{const ps=await user.profiles(need);need.forEach(i=>{S.names[i]=(ps&&ps[i]&&ps[i].name)||'';});safeRender();}catch(e){}
}
const nm=id=>S.names[id]||'Usuario';

/* elegibilidad de partidas por rol */
const llegOk=(r,l)=>S.role==='compras'&&!!r&&!!l&&r.estado!=='borrador'&&l.auth!=='rechazada'&&(!l.recibido||recFalta(l)>1e-9);
const llegFecha=(r,l)=>(l.oc&&l.oc!=='NA')?l.oc.fecha:((l.entrega&&l.entrega.fecha)||r.fechaReq||'');
const llegObj=l=>(l.oc&&l.oc!=='NA')?l.oc:l.entrega;
const elegCompras=l=>l.auth==='autorizada'&&!l.oc&&!l.bodega&&excOk(l);
const recQ=l=>l.recibido?Number(l.recibido.cant)||0:0;
const recFalta=l=>Math.max(0,r2(Number(l.cant)-recQ(l)));
const elegRecep=l=>l.auth==='autorizada'&&!l.adm&&l.oc&&recFalta(l)>1e-9&&excOk(l);
const elegPagar=l=>l.auth==='autorizada'&&l.oc&&l.pago==='pendiente'&&excOk(l)&&!l.cubRep;
const elegCred=l=>l.pago==='credito';
function eligibleFor(l){
  if(S.role==='compras')return elegCompras(l)||elegRecep(l);
  if(S.role==='administracion')return elegPagar(l)||elegCred(l);
  return false;
}
function canEdit(r,l){
  if(S.role==='residente')return r.estado==='devuelta'&&isMine(r)&&l.auth==='pendiente';
  if(S.role==='compras')return r.estado==='compras'&&l.auth==='pendiente';
  if(S.role==='administracion')return r.estado==='administracion'&&l.auth==='pendiente';
  if(S.role==='direccion')return(r.estado==='direccion'||r.estado==='resuelta')&&l.auth==='pendiente';
  return false;
}

/* ───────── render general ───────── */
const NAV_GROUPS=[['Obras',['proy']],['Gastos',['mis','nueva','revisar','oc','recibir','ocs','autorizar','excep','resueltas','pagar','credito','pagadas','todas','repos']],['Nómina',['nom','nomina','emps','nomaut','altas']],['Tareas',['tareas','tareasm']],['Herramientas',['herr_vanos']],['Consultas',['cal','prov','rep']],['Seguridad',['usuarios','anuncios','depurar','bitacora']],['Avisos',['notif']]];
function navGroups(){
  const out=[];
  NAV_GROUPS.forEach(g=>{const tabs=tabsOf(S.role).filter(t=>g[1].indexOf(t[0])>=0);if(tabs.length)out.push({name:g[0],tabs:tabs});});
  return out;
}
const $=id=>document.getElementById(id);
function render(){
  syncRoleSel();
  const rw=$('role-wrap');if(rw)rw.style.display=(S.mode==='local'||S.auth==='owner')?'':'none';
  const wh=$('who');if(wh)wh.textContent=((S.auth==='ok'||S.auth==='owner')&&S.mode==='cloud')?(S.viewAs?'Viendo como '+(S.viewAs.nombre||S.viewAs.email):((S.me&&(S.me.nombre||S.me.email))||'')+' · '+(PERFILES[S.role]||'')):(S.viewAs?'Viendo como '+S.viewAs.nombre:'');
  try{bellRender();}catch(e){}
  if(S.auth==='loading'||S.auth==='denied'||S.auth==='inactive'){$('nav').innerHTML='';$('app').innerHTML=accessMsg();S.open=null;const dd=$('drawer');if(dd){dd.classList.remove('on');dd.innerHTML='';}const oo=$('ov');if(oo)oo.classList.remove('on');return;}
  const nav=$('nav');
  const gs=navGroups();
  if(S.navTab!==S.tab){S.navTab=S.tab;const g0=gs.find(g=>g.tabs.some(t=>t[0]===S.tab));if(g0)S.navG=g0.name;}
  nav.innerHTML=gs.map(g=>{
    const open=S.navG===g.name,tot=sum(g.tabs.map(t=>tabCount(t[0])));
    if(g.name==='Herramientas'&&g.tabs.length===1)return '<button class="nav-g" data-act="tab" data-k="'+g.tabs[0][0]+'" aria-current="'+(S.tab===g.tabs[0][0])+'" style="'+(S.tab===g.tabs[0][0]?'color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent)':'')+'"><span>'+esc(g.name)+'</span></button>';
    return '<button class="nav-g" data-act="navg" data-g="'+esc(g.name)+'" aria-expanded="'+open+'"><span>'+(open?'▾':'▸')+' '+esc(g.name)+'</span>'+(tot&&!open?'<span class="badge">'+tot+'</span>':'')+'</button>'+
    (open?g.tabs.map(t=>{
      const n=tabCount(t[0]);
      const nuevo=(S.role==='administracion'&&t[0]==='credito'&&n>0);
      return '<button class="nav-i" data-act="tab" data-k="'+t[0]+'" aria-current="'+(S.tab===t[0])+'">'+esc(t[1])+(n?'<span class="badge'+(nuevo?' new':'')+'">'+n+'</span>':'')+'</button>';
    }).join(''):'');
  }).join('');
  const app=$('app');
  let h='';
  if(S.mode==='local')h+='<div class="banner">Modo local: lo que capture aquí no se comparte con otras personas hasta que la página se abra desde su enlace publicado.</div>';
  if(!S.ready){h+='<div class="empty"><p>Cargando requisiciones…</p></div>';app.innerHTML=h;return;}
  if(NOMTABS.indexOf(S.tab)<0&&S.tab!=='notif'&&S.tab!=='repos'&&S.tab.indexOf('herr_')!==0&&S.role!=='sistemas')h+=statsHtml();
  h+=viewHtml();
  app.innerHTML=h;
  renderDrawer();
  refreshProvList();refreshObras();
  const tp=document.querySelector('.top');if(tp)document.documentElement.style.setProperty('--topH',tp.offsetHeight+'px');
  try{anuncioOverlay();}catch(e){}
  try{tareaAviso();}catch(e){}
}
let pendingRender=false;
function safeRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.closest('#nav')){pendingRender=true;return;}
  render();
}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,0);}});

function tabCount(k){
  const R=S.role;
  if(k==='repos'){try{return Vp().filter(repAtender).length;}catch(e){return 0;}}
  if(k==='tareasm'){try{return (S.tareas||[]).filter(t=>tarMine(t)&&t.estado!=='terminada'&&(tarEst(t)[0]==='VENCIDO'||t.estado==='asignada')).length;}catch(e){return 0;}}
  if(k==='tareas'){try{return tarAdm()?tarVis().filter(t=>t.mod).length:0;}catch(e){return 0;}}
  if(k==='notif'){try{return nAll().filter(n=>!nRead(n)).length;}catch(e){return 0;}}
  if(k==='altas'){try{if(R==='administracion')return S.altas.filter(a=>a.estado==='pendiente').length;if(R==='residente')return S.altas.filter(a=>a.creatorId===myId&&(a.estado==='devuelta'||a.estado==='rechazada')).length;}catch(e){}return 0;}
  if((R==='residente'||R==='compras')&&k==='mis')return V().filter(r=>r.estado==='devuelta'&&isMine(r)).length;
  if(R==='auditor'&&k==='revisar')return V().filter(r=>r.estado==='auditoria').length;
  if(R==='compras'){
    if(k==='revisar')return V().filter(r=>r.estado==='compras').length;
    if(k==='oc')return allLines(elegCompras).length;
    if(k==='recibir')return allLines(elegRecep).length;
  }
  if(R==='residente'&&k==='nom')return Vn().filter(n=>n.estado==='elaboracion'&&n.devolucion).length;
  if(R==='administracion'&&k==='nomina')return Vn().filter(n=>n.estado==='enviada'||n.estado==='revision').length;
  if(R==='direccion'&&k==='nomaut')return Vn().filter(n=>n.estado==='direccion').length;
  if(k==='excep'&&(R==='compras'||R==='administracion'))return excRows().filter(x=>excIsPend(x)&&x.r.estado!=='auditoria').length;
  if(R==='direccion'&&k==='autorizar')return V().filter(r=>(r.estado==='direccion'||r.estado==='resuelta')&&L(r).some(l=>l.auth==='pendiente')).length;
  if(R==='administracion'){
    if(k==='revisar')return V().filter(r=>r.estado==='administracion').length;
    if(k==='pagar')return allLines(elegPagar).length;
    if(k==='credito')return allLines(elegCred).length;
  }
  return 0;
}
function statsHtml(){

  }else if(R==='direccion'){

    h=st('Por autorizar',V().filter(r=>(r.estado==='direccion'||r.estado==='resuelta')&&L(r).some(l=>l.auth==='pendiente')).length,p.length+' partidas')+st('Monto pendiente',money(sum(p.map(x=>x.l.total))),'por autorizar')+st('Autorizado',money(sum(V().map(reqAut))),'acumulado');
  }else{
    const pg=allLines(elegPagar),cr=allLines(elegCred);
    const espera=allLines(l=>l.auth==='autorizada'&&!l.oc&&!l.bodega).length;
    h=st('Por revisar',V().filter(r=>r.estado==='administracion').length,'gastos dirigidos a Administración')+st('Por pagar',money(sum(pg.map(x=>x.l.total))),pg.length+' partidas con OC resuelta')+st('Saldo a crédito',money(sum(cr.map(x=>saldo(x.l)))),cr.length+' partidas')+st('Pagado',money(sum(V().map(reqPag))),'acumulado')+(espera?st('Esperan OC',espera,'Compras aún no define OC'):'');
  }
  return '<div class="stats">'+h+'</div>';
}

const TF_CATS=[['','Todas'],['proceso','En proceso'],['autorizar','Por autorizar'],['autorizada','Autorizadas'],['rechazada','Rechazadas'],['pagada','Pagadas']];
S.tf={q:'',st:''};
function tfCat(r){
  const e=r.estado;
  if(e==='elaboracion'||e==='auditoria'||e==='compras'||e==='administracion'||e==='devuelta')return 'proceso';
  const t=statusOf(r)[0];
  if(/^Pagada/.test(t))return 'pagada';
  if(/^Rechazada/.test(t))return 'rechazada';
  if(/^Pendiente de autorización de Dirección/.test(t)||/parcial/.test(t))return 'autorizar';
  return 'autorizada';
}
function todasList(){
  const q=normQ(S.tf.q||'').trim();

function lineChips(l,compact){
  let h='';
  if(l.auth==='pendiente')h+=pill('Pendiente por autorizar','warn');
  else if(l.auth==='rechazada')h+=pill('Rechazada','bad');
  else if(l.bodega)h+=pill('Autorizada','ok')+' '+pill('Material en bodega','info');
  else{
    h+=pill('Autorizada','ok');
    if(l.oc==='NA'){if(!l.adm)h+=' '+pill('No aplica OC','mute');}
    else if(l.oc)h+=' '+pill(l.oc.folio,'info');
    else h+=' '+pill('Sin OC','mute');
    if(l.recibido)h+=' '+(recFalta(l)>1e-9?pill('Recibido '+recQ(l)+' de '+l.cant+' · faltan '+recFalta(l),'warn'):pill('Recibida','ok'));
    if(l.pago==='pagado')h+=' '+pill('Pagado','ok');
    else if(l.pago==='credito')h+=' '+pill(l.abonos&&l.abonos.length?'Crédito · saldo '+money(saldo(l)):'Crédito','warn');
    else h+=' '+pill('Pendiente de pago','warn');
  }
  if(paqM(l))h+=' '+pill('Paquetería ESTIMADO '+money(paqM(l)),'warn');
  if(l.provExc)h+=' '+pill(l.provExc.estado==='autorizada'?'Excepción autorizada':(l.provExc.estado==='rechazada'?'Excepción rechazada':'Excepción pendiente'),l.provExc.estado==='autorizada'?'ok':(l.provExc.estado==='rechazada'?'bad':'warn'));
  return '<div class="chips">'+h+'</div>';
}

  const copy=clone(p);
  const i=S.provs.findIndex(x=>x.id===p.id);
  if(i>=0)S.provs[i]=copy;else S.provs.push(copy);
  sortProvs();render();

function setProv(t,val){
  const v=String(val||'').trim();
  if(normQ(v)===normQ(BOD_OPT)){t.bodega=true;t.provId='';t.provSnap=null;t.provExc=null;t.proveedor=BOD_OPT;return;}
  t.bodega=false;
  if(v===EXC_OPT){if(!t.provExc)t.provExc={nombre:'',just:'',estado:'pendiente'};t.provId='';t.provSnap=null;t.proveedor=t.provExc.nombre||'';return;}
  const p=S.provs.find(x=>x.activo&&provLabel(x)===v);
  if(p){t.provId=p.id;t.provSnap=snapProv(p);t.proveedor=p.alias||p.razon;t.provExc=null;return;}
  t.provId='';t.provSnap=null;t.provExc=null;t.proveedor=v;
}
function provDetail(l,scope,i){
  const a='data-scope="'+scope+'" data-i="'+i+'"';
  if(l.bodega)return '<div class="pcard"><b>Material en bodega</b><p class="muted" style="margin:4px 0 0">Se surtirá de las existencias de bodega. No requiere proveedor, orden de compra ni pago; Dirección lo autoriza como cualquier otra partida.</p></div>';
  if(l.provExc){
    const e=l.provExc;
    let h='<div class="pcard"><b>Proveedor con excepción</b><p class="muted" style="margin:4px 0 8px">La excepción la autoriza Compras (o Administración, si el gasto va a Administración) al revisar la requisición. No podrá avanzar a Dirección, OC ni pago hasta que se autorice.</p>';
    if(e.estado==='rechazada')h+='<div class="note warn" style="margin-bottom:8px"><b>Excepción rechazada por Dirección.</b> '+esc(e.obs||'')+' Elija un proveedor del catálogo o ajuste el nombre y la justificación.</div>';
    h+='<div class="f"><label>Nombre del proveedor <i>*</i></label><input '+a+' data-f="excNombre" value="'+esc(e.nombre)+'" autocomplete="off"></div>'+
      '<div class="f" style="margin-top:8px"><label>Justificación: por qué se requiere un proveedor no registrado o inactivo <i>*</i></label><textarea '+a+' data-f="excJust">'+esc(e.just)+'</textarea></div></div>';

    '<div id="pb-'+scope+i+'" style="grid-column:1/-1">'+provDetail(l,scope,i)+'</div>';

function provErr(l,i,legacyOk){
  const n='Partida '+(i+1)+': ';
  if(l.bodega)return '';
  if(l.provExc){
    if(!(l.provExc.nombre||'').trim())return n+'escriba el nombre del proveedor con excepción.';
    if(!(l.provExc.just||'').trim())return n+'escriba la justificación de la excepción.';
    return '';
  }
  if(l.provId){
    if(legacyOk)return '';
    const p=provById(l.provId);
    if(!p||!p.activo)return n+'el proveedor seleccionado no está activo. Elija otro o use PROVEEDOR CON EXCEPCIÓN.';
    return '';
  }
  if(legacyOk)return '';
  return n+'seleccione un proveedor activo del catálogo o PROVEEDOR CON EXCEPCIÓN.';
}

/* módulo PROVEEDORES */
function provLinks(p){
  const out=[];const n1=normQ(p.alias),n2=normQ(p.razon);
  V().forEach(r=>{if(r.estado==='elaboracion')return;L(r).forEach(l=>{
    if(l.provId===p.id||(!l.provId&&!l.provExc&&l.proveedor&&(normQ(l.proveedor)===n1||normQ(l.proveedor)===n2)))out.push({r:r,l:l});});});
  return out;
}

function provFiltered(){
  return S.provs.filter(p=>{
    if(S.pvEst&&String(p.activo?1:0)!==S.pvEst)return false;
    if(S.pvDep&&p.depto!==S.pvDep)return false;
    const q=normQ(S.pvq).trim();if(!q)return true;
    const t=normQ([p.razon,p.alias,p.rfc,p.banco,p.titular].join(' '));
    return q.split(/\s+/).every(w=>t.indexOf(w)>=0);
  });
}

async function provSubmit(root,p){
  const g=id=>root.querySelector('#'+id);
  const v={razon:g('pv-razon').value.trim(),alias:g('pv-alias').value.trim(),rfc:g('pv-rfc').value.toUpperCase().replace(/\s+/g,''),titular:g('pv-titular').value.trim(),banco:g('pv-banco').value.trim(),clabe:g('pv-clabe').value.replace(/[\s-]/g,''),activo:g('pv-act').value==='1'};
  if(!v.razon)return 'Capture la razón social o nombre fiscal.';
  if(!v.alias)return 'Capture el alias o nombre comercial.';
  if(!v.rfc)return 'Capture el RFC del proveedor.';
  if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(v.rfc))return 'El RFC no tiene un formato válido (12 caracteres para persona moral, 13 para persona física).';
  if(!v.titular)return 'Capture el titular de la cuenta bancaria.';
  if(!v.banco)return 'Capture la institución bancaria.';
  if(!/^\d{18}$/.test(v.clabe))return 'La CLABE interbancaria debe tener exactamente 18 dígitos'+(v.clabe?' (capturó '+v.clabe.length+').':'.');
  const csf=g('pv-csf').files[0],bdoc=g('pv-bdoc').files[0];
  if(!csf&&!(p&&p.csf))return 'Adjunte la Constancia de Situación Fiscal (PDF o imagen).';
  const dupR=S.provs.find(x=>(!p||x.id!==p.id)&&x.rfc===v.rfc);
  if(dupR)return 'ALERTA DE DUPLICADO: el RFC '+v.rfc+' ya está registrado como “'+dupR.alias+'” ('+(ROLES[dupR.depto]||'')+'). No se permiten proveedores duplicados.';
  const dupC=S.provs.find(x=>(!p||x.id!==p.id)&&x.clabe===v.clabe);
  if(dupC)return 'ALERTA DE DUPLICADO: la CLABE '+mask(v.clabe)+' ya está registrada con “'+dupC.alias+'” ('+(ROLES[dupC.depto]||'')+'). No se permiten cuentas duplicadas.';
  const upC=csf?await uploadFile(csf):null,upB=bdoc?await uploadFile(bdoc):null;
  if(!p){
    const n=Object.assign({id:rid(),csf:upC,bdoc:upB||null,depto:S.role,uid:myId,creado:Date.now(),hist:[]},v);
    ph(n,'Creó el proveedor “'+v.alias+'” (RFC '+v.rfc+')'+(v.activo?'':' como Inactivo')+'; adjuntó la Constancia de Situación Fiscal'+(upB?' y documento bancario':''),'alta');
    await saveProv(n);return true;
  }
  if(!canEditProv(p))return 'Solo el departamento que registró al proveedor puede editarlo.';
  const ch=[];const df=(lab,a,b)=>{if(a!==b)ch.push(lab+': “'+a+'” → “'+b+'”');};
  df('Razón social',p.razon,v.razon);df('Alias',p.alias,v.alias);df('RFC',p.rfc,v.rfc);
  const bank=[];
  if(p.titular!==v.titular)bank.push('titular “'+p.titular+'” → “'+v.titular+'”');
  if(p.banco!==v.banco)bank.push('institución “'+p.banco+'” → “'+v.banco+'”');
  if(p.clabe!==v.clabe)bank.push('CLABE '+mask(p.clabe)+' → '+mask(v.clabe));
  const n=clone(p);let changed=false;
  if(ch.length){ph(n,'Modificó datos generales — '+ch.join('; '),'edicion');changed=true;}
  if(bank.length){ph(n,'Cambio de datos bancarios: '+bank.join('; '),'banco');changed=true;}
  if(p.activo!==v.activo){ph(n,'Cambió el estatus de '+(p.activo?'Activo':'Inactivo')+' a '+(v.activo?'Activo':'Inactivo'),'estatus');changed=true;}
  if(upC){ph(n,'Actualizó la Constancia de Situación Fiscal ('+upC.name+')','doc');n.csf=upC;changed=true;}
  if(upB){ph(n,'Actualizó el documento bancario ('+upB.name+')','doc');n.bdoc=upB;changed=true;}
  if(!changed)return true;
  Object.assign(n,v);
  await saveProv(n);return true;
}

function datesBetween(a,b){const o=[];if(!a||!b||b<a)return o;let d=a;while(d<=b&&o.length<40){o.push(d);d=addDays(d,1);}return o;}
const dowOf=iso=>new Date(iso+'T12:00:00').getDay();
const dayLbl=iso=>new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'2-digit'});
const DIAS_ALL=[1,2,3,4,5,6];
const DOW_N=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function defaultDia(d,ln){const dl=(ln&&ln.diasLab)||DIAS_ALL;return{e:dl.indexOf(dowOf(d))>=0?'T':'D',h:0};}
function calcLine(ln,dates){
  const dias=ln.dias||{};let T=0,D=0,V=0,F=0,H=0;
  dates.forEach(d=>{const x=dias[d]||defaultDia(d,ln);if(x.e==='T')T++;else if(x.e==='D')D++;else if(x.e==='V')V++;else F++;H+=Number(x.h)||0;});
  const s=Number(ln.sueldo)||0,f=Number(ln.factor)||2,N=dates.length;
  const base=r2(s*N),desc=r2(s*F),he=r2(H*(s/(Number(ln.horasDia)||8))*f),agui=r2((Number(ln.aguinaldoDias)||0)*s),bon=r2(sum((ln.bonos||[]).map(b=>Number(b.monto)||0)));
  return{T:T,D:D,V:V,F:F,H:H,N:N,base:base,desc:desc,he:he,agui:agui,bon:bon,total:r2(base-desc+he+agui+bon)};
}
const nomDates=n=>datesBetween(n.desde,n.hasta);
const nomTotal=n=>r2(sum((n.lineas||[]).filter(l=>!l.rechazada).map(l=>calcLine(l,nomDates(n)).total)));
const nomActivas=n=>(n.lineas||[]).filter(l=>!l.rechazada);

function Vn(){
  return S.noms.filter(n=>{
    if(n.estado==='elaboracion')return n.creatorId===myId;
    if(S.role==='residente')return n.creatorId===myId;
    if(S.role==='direccion')return n.estado==='direccion'||n.estado==='autorizada'||n.estado==='rechazada';
    return S.role==='administracion';
  }).sort((a,b)=>(b.creado||0)-(a.creado||0));
}
async function saveEmp(e){
  const copy=clone(e);const i=S.emps.findIndex(x=>x.id===e.id);
  if(i>=0)S.emps[i]=copy;else S.emps.push(copy);
  S.emps.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es'));render();
  if(empColl){const ref=empColl.doc(e.id);let err=null;try{await ref.set(copy);}catch(e1){err=e1;try{await ref.update(copy);err=null;}catch(e2){err=e2;}}
    if(err)setTimeout(()=>toast('No se pudo guardar el empleado en la base compartida: '+((err&&(err.message||err.code))||String(err))),50);}
}
async function saveNom(n){

  try{const sk='n'+n.id;ndiffNom(SNAP[sk]?JSON.parse(SNAP[sk].j):null,copy);snapPut(sk,copy);}catch(e){}
  const i=S.noms.findIndex(x=>x.id===n.id);
  if(i>=0)S.noms[i]=copy;else S.noms.push(copy);
  render();
  if(nomColl){const ref=nomColl.doc(n.id);let err=null;try{await ref.set(copy);}catch(e1){err=e1;try{await ref.update(copy);err=null;}catch(e2){err=e2;}}
    if(err)setTimeout(()=>toast('No se pudo guardar la nómina en la base compartida: '+((err&&(err.message||err.code))||String(err))),50);}
}

/* acumulados derivados de las nóminas autorizadas */
function empStats(e){
  const o={dias:0,he:0,vac:0,agui:0,faltas:0,descuentos:0,pagado:0,regs:[]};
  S.noms.filter(n=>n.estado==='autorizada').forEach(n=>(n.lineas||[]).forEach(l=>{
    if(l.empId!==e.id||l.rechazada)return;const c=calcLine(l,nomDates(n));
    o.dias+=c.T;o.he+=c.H;o.vac+=c.V;o.agui+=Number(l.aguinaldoDias)||0;o.faltas+=c.F;o.descuentos+=c.desc;o.pagado+=c.total;o.regs.push({n:n,c:c,l:l});
  }));
  o.descuentos=r2(o.descuentos);o.pagado=r2(o.pagado);return o;
}

async function empSubmit(root,e){
  const g=id=>root.querySelector('#'+id);
  const v={nombre:g('em-nombre').value.trim(),obra:g('em-obra').value.trim(),sueldo:Number(g('em-sueldo').value),factor:Number(g('em-factor').value),vacDias:Number(g('em-vac').value),aguiDias:Number(g('em-agui').value),activo:g('em-act').value==='1',horasDia:Number(g('em-horas').value),diasLab:[...root.querySelectorAll('input[data-dl]')].filter(x=>x.checked).map(x=>Number(x.dataset.dl))};
  if(!v.nombre)return 'Capture el nombre completo del trabajador.';
  if(!(v.sueldo>0))return 'Capture el sueldo base diario (mayor a cero).';
  if(!(v.factor>=1))return 'El pago de hora extra debe ser al menos 1 vez el valor de la hora.';
  if(!(v.horasDia>0&&v.horasDia<=24))return 'Capture las horas que trabaja al día (entre 1 y 24).';
  if(!v.diasLab.length)return 'Seleccione al menos un día de trabajo a la semana.';
  if(!(v.vacDias>=0)||!(v.aguiDias>=0))return 'Los días de vacaciones y aguinaldo no pueden ser negativos.';
  const dup=S.emps.find(x=>(!e||x.id!==e.id)&&normQ(x.nombre)===normQ(v.nombre)&&normQ(x.obra||'')===normQ(v.obra));
  if(dup)return 'ALERTA DE DUPLICADO: ya existe un empleado con ese nombre en la misma obra.';
  if(!e){
    const n=Object.assign({id:rid(),creado:Date.now(),uid:myId,hist:[]},v);
    nh(n,'Creó el expediente (sueldo base diario '+money(v.sueldo)+(v.obra?'; obra '+v.obra:'')+')');
    await saveEmp(n);return true;
  }
  const n=clone(e);const ch=[];
  if(e.nombre!==v.nombre)ch.push('nombre “'+e.nombre+'” → “'+v.nombre+'”');
  if(Number(e.sueldo)!==v.sueldo)ch.push('sueldo base diario '+money(e.sueldo)+' → '+money(v.sueldo));
  if((e.obra||'')!==v.obra)ch.push('obra “'+(e.obra||'—')+'” → “'+(v.obra||'—')+'”');
  const dls=a=>(a||DIAS_ALL).slice().sort().map(k=>DOW_N[k]).join(', ');
  if(dls(e.diasLab)!==dls(v.diasLab))ch.push('días de trabajo '+dls(e.diasLab)+' → '+dls(v.diasLab));
  if((Number(e.horasDia)||8)!==v.horasDia)ch.push('horas por día '+(Number(e.horasDia)||8)+' → '+v.horasDia);
  if(Number(e.factor)!==v.factor)ch.push('factor de hora extra '+e.factor+' → '+v.factor);
  if(Number(e.vacDias)!==v.vacDias)ch.push('vacaciones que corresponden '+e.vacDias+' → '+v.vacDias);
  if(Number(e.aguiDias)!==v.aguiDias)ch.push('aguinaldo que corresponde '+e.aguiDias+' → '+v.aguiDias+' días');
  if(e.activo!==v.activo)ch.push('estatus '+(e.activo?'Activo':'Inactivo')+' → '+(v.activo?'Activo':'Inactivo'));
  if(!ch.length)return true;
  nh(n,'Modificó el expediente: '+ch.join('; '));Object.assign(n,v);
  await saveEmp(n);return true;
}

function nomValidate(d){
  const dates=datesBetween(d.desde,d.hasta);
  if(S.role==='residente'&&!(d.obra||'').trim())return 'Capture la obra de la nómina.';
  if(!d.desde||!d.hasta||d.hasta<d.desde)return 'Indique un periodo válido (la fecha final no puede ser anterior a la inicial).';
  if(dates.length>31)return 'El periodo no puede ser mayor a 31 días.';
  if(!d.lineas.length)return 'Agregue al menos un trabajador.';
  const set=new Set(dates);
  for(const ln of d.lineas){
    for(const o of S.noms){
      if(o.id===d.id||o.estado==='rechazada'||o.estado==='elaboracion')continue;
      if(!(o.lineas||[]).some(x=>x.empId===ln.empId&&!x.rechazada))continue;
      if(nomDates(o).some(x=>set.has(x)))return 'DUPLICADO: '+ln.nombre+' ya está en la nómina '+o.folio+' ('+fdate(o.desde)+' – '+fdate(o.hasta+'')+'), cuyo periodo se traslapa con este.';

}
function lineDiff(a,b,dates){

  [['T','días trabajados'],['D','descansos'],['V','vacaciones'],['F','faltas'],['H','horas extra']].forEach(p=>{if(ca[p[0]]!==cb[p[0]])o.push(p[1]+' '+ca[p[0]]+' → '+cb[p[0]]);});
  if((Number(a.aguinaldoDias)||0)!==(Number(b.aguinaldoDias)||0))o.push('aguinaldo '+(Number(a.aguinaldoDias)||0)+' → '+(Number(b.aguinaldoDias)||0)+' días');
  if(ca.bon!==cb.bon)o.push('bonos '+money(ca.bon)+' → '+money(cb.bon));
  if((a.nota||'')!==(b.nota||''))o.push('observaciones');

    else if(r2(o.importe)===r2(r.importe)&&r.fechaGasto&&o.fechaGasto===r.fechaGasto&&n(o.proveedor)===n(r.proveedor))out.push('Importe, fecha y proveedor coinciden con la reposición '+o.folio+'.');
    else if(r2(o.importe)===r2(r.importe)&&n(o.concepto)&&n(o.concepto)===n(r.concepto)&&n(o.obra)===n(r.obra))out.push('Concepto, obra e importe coinciden con la reposición '+o.folio+'.');
  });
  S.reqs.forEach(q=>L(q).forEach(l=>{
    if(l.cubRep&&l.cubRep.id!==r.id)return;
    const lig=r.reqId===q.id&&(r.lineasIds||[]).indexOf(l.id)>=0;
    if(lig){
      if(l.pago==='pagado'||(l.abonos&&l.abonos.length))out.push('La partida '+l.clave+' de '+q.folio+' ya tiene pago al proveedor: riesgo de pagar dos veces el mismo gasto.');
      else if(l.pago==='credito')out.push('La partida '+l.clave+' de '+q.folio+' está en crédito con el proveedor: riesgo de doble obligación.');

  }));
  return [...new Set(out)];
}
async function repSync(r){

function conAlertas(rs){
  const key=x=>normQ(x.clave||x.concepto)+'|'+normQ(x.unidad),g={};
  rs.forEach(x=>{(g[key(x)]=g[key(x)]||[]).push(x);});
  rs.forEach(x=>{
    const arr=g[key(x)],al=[],pus=arr.map(y=>y.pu),mn=Math.min.apply(null,pus),mx=Math.max.apply(null,pus);
    if(arr.length>1&&mx-mn>0.005)al.push('Precio distinto ('+money(mn)+' a '+money(mx)+')');
    const mm=arr.filter(y=>y.obra===x.obra).length;if(mm>1)al.push('Posible duplicado en la obra ('+mm+')');
    if(x.cantAut>0&&x.cantAut<x.cantSol)al.push('Autorizado menor a lo solicitado');
    if(x.cantRec>0&&x.cantRec<x.cantCom)al.push('Recibido menor a lo comprado');

}

function comparativo(rs){

  recepcion(){
    const picks=selectedPicks(elegRecep);if(!picks.length)return;
    const rowsH=picks.map(x=>{const f=recFalta(x.l);return '<div class="f"><label for="rc-'+x.l.id+'">'+esc(x.r.folio)+' · '+esc(x.l.clave)+' '+esc(x.l.concepto)+'</label><div class="muted" style="font-size:13px;margin-bottom:4px">Comprado <b>'+x.l.cant+'</b> '+esc(x.l.unidad||'')+' · Ya recibido <b>'+recQ(x.l)+'</b> · Faltan <b>'+f+'</b></div><input id="rc-'+x.l.id+'" type="number" min="0" max="'+f+'" step="any" inputmode="decimal" data-rec="'+key(x.r,x.l)+'" value="'+f+'" aria-label="Cantidad recibida ahora"></div>';}).join('');
    modal({title:'Registrar recepción',html:'<p style="margin:0" class="muted">Escriba la cantidad que recibe <b>ahora</b>. Si recibe menos de lo comprado, la partida seguirá en «Por recibir» con lo que falta. Con 0 no se registra recepción.</p>'+rowsH+'<div class="f"><label for="m-fecha">Fecha de recepción</label><input id="m-fecha" type="date" value="'+todayISO()+'"></div>',ok:'Registrar recepción',noFocus:true,onOk:async root=>{
      const fecha=root.querySelector('#m-fecha').value||todayISO();let err='';
      const vals=[...root.querySelectorAll('input[data-rec]')].map(i=>{const pk=picks.find(x=>key(x.r,x.l)===i.dataset.rec),v=Number(i.value),f=recFalta(pk.l);if(i.value===''||isNaN(v)||v<0||v>f+1e-9)err='La cantidad recibida de '+pk.l.clave+' debe estar entre 0 y '+f+' (lo que falta por recibir).';return{p:pk,v:v};});
      if(err)return err;
      const hechos=vals.filter(a=>a.v>0);
      if(!hechos.length)return 'Capture una cantidad mayor a 0 en al menos una partida.';
      hechos.forEach(a=>{const l=a.p.l,tot=r2(recQ(l)+a.v);(l.recs=l.recs||[]).push({fecha:fecha,cant:a.v,uid:myId});l.recibido={fecha:fecha,cant:tot,uid:myId};
        lh(l,'Recepción: +'+a.v+' '+(l.unidad||'')+' el '+fdate(fecha)+' · acumulado '+tot+' de '+l.cant+(tot<Number(l.cant)?' · faltan '+r2(Number(l.cant)-tot):' · completa'));});
      [...new Set(hechos.map(a=>a.p.r))].forEach(r=>hist(r,'registró la recepción de '+hechos.filter(a=>a.p.r===r).length+' partida(s)'));
      hechos.forEach(a=>S.sel.delete(key(a.p.r,a.p.l)));await saveMany(hechos.map(a=>a.p));return true;}});
  },

  /* edición de partida */
  editlinea(el){
    const r=reqById(el.dataset.id),l=L(r).find(x=>x.id===el.dataset.l);
    S.tmp=clone(l);
    modal({title:'Editar partida',html:lineFields(S.tmp,0,'modal'),ok:'Guardar cambios',noFocus:true,onOk:async()=>{
      const t=S.tmp;
      if(!t.clave.trim()||!t.concepto.trim())return 'La clave y el concepto son obligatorios.';
      if(!(Number(t.cant)>0)||!(Number(t.pu)>0))return 'Cantidad y precio unitario deben ser mayores a cero.';
      if(!t.justificacion.trim())return 'La justificación es obligatoria.';
      const prevExc=l.provExc?clone(l.provExc):null;
      const legacyOk=(!l.provId&&!l.provExc&&!t.provExc&&!t.provId&&t.proveedor===l.proveedor)||(!!l.provId&&t.provId===l.provId&&!t.provExc);
      const pe=provErr(t,0,legacyOk);if(pe)return pe;
      const antes=l.total,cantAntes=l.cant,paqPrev=paqM(l);
      if(!l.orig)l.orig={cant:l.cant,pu:l.pu,total:l.total};
      const antesPu=l.pu,antesProv=l.proveedor;
      Object.assign(l,t,{total:lt(t),orig:l.orig,h:l.h});
      if(l.provExc){
        const same=prevExc&&prevExc.nombre===l.provExc.nombre&&prevExc.just===l.provExc.just;
        if(same)l.provExc=prevExc;else{l.provExc={nombre:l.provExc.nombre,just:l.provExc.just,estado:'pendiente',solT:Date.now(),solUid:myId};lh(l,'Proveedor con excepción solicitado a '+excWho(r)+': '+l.provExc.nombre+' — '+l.provExc.just);hist(r,'solicitó autorización de excepción para el proveedor “'+l.provExc.nombre+'” (partida '+l.clave+')');}
      }else if(prevExc){lh(l,'Excepción de proveedor retirada; proveedor: '+(l.proveedor||'—'));}
      if(paqM(t)!==paqPrev)lh(l,'Paquetería ESTIMADO: de '+money(paqPrev)+' a '+money(paqM(t)));
      lh(l,'Editada'+(cantAntes!==l.cant?': cantidad de '+cantAntes+' a '+l.cant:'')+(antesPu!==l.pu?'; precio unitario de '+money(antesPu)+' a '+money(l.pu):'')+(antesProv!==l.proveedor?'; proveedor de '+(antesProv||'-')+' a '+(l.proveedor||'-'):'')+'; importe '+money(l.total));
      hist(r,'editó la partida '+l.clave+(cantAntes!==l.cant?' (cantidad de '+cantAntes+' a '+l.cant+')':'')+(antes!==l.total?' (importe de '+money(antes)+' a '+money(l.total)+')':''));await save(r);return true;}});

function abonoModal(){
  const picks=selectedPicks(elegCred);if(!picks.length)return;
  const rowsH=picks.map(x=>'<div class="f"><label for="ab-'+x.l.id+'">'+esc(x.r.folio)+' · '+esc(x.l.clave)+' '+esc(x.l.concepto)+' <span class="muted">(saldo '+money(saldo(x.l))+')</span></label><input id="ab-'+x.l.id+'" type="number" min="0" max="'+saldo(x.l)+'" step="0.01" inputmode="decimal" data-abono="'+key(x.r,x.l)+'" value="'+saldo(x.l)+'"></div>').join('');
  modal({title:'Registrar abono a crédito',html:'<p style="margin:0" class="muted">Escriba cuánto abona a cada partida. Puede ser menos que el saldo; el resto sigue a crédito.</p>'+rowsH+
    '<div class="row"><b>Total del abono: <span id="ab-tot" class="mono">'+money(sum(picks.map(x=>saldo(x.l))))+'</span></b><button class="btn sm" type="button" data-act="abfull">Pagar saldos completos</button></div>'+
    '<div class="f"><label for="m-fecha">Fecha de pago</label><input id="m-fecha" type="date" value="'+todayISO()+'"></div>'+
    '<div class="f"><label for="m-file">Comprobante de pago <i>*</i></label><input id="m-file" type="file" accept=".pdf,.png,.jpg,.jpeg"></div>',
    ok:'Registrar abono',noFocus:true,onOk:async root=>{
      const file=root.querySelector('#m-file').files[0];
      const ins=[...root.querySelectorAll('input[data-abono]')];
      const amts=[];let err='';
      ins.forEach(i=>{const k=i.dataset.abono,v=r2(i.value);const pk=picks.find(x=>key(x.r,x.l)===k);
        if(i.value!==''&&(isNaN(v)||v<0))err='Hay un monto inválido.';
        else if(v>saldo(pk.l)+0.005)err='El abono de '+pk.l.clave+' no puede ser mayor a su saldo ('+money(saldo(pk.l))+').';
        else if(v>0)amts.push({p:pk,v:v});});
      if(err)return err;
      if(!amts.length)return 'Escriba el monto de al menos una partida.';
      if(!file)return 'Suba el comprobante de pago.';
      const fecha=root.querySelector('#m-fecha').value||todayISO();
      const up=await uploadFile(file);
      amts.forEach(a=>{const l=a.p.l;(l.abonos=l.abonos||[]).push({fecha:fecha,monto:a.v,comprobante:up});lh(l,'Abono de '+money(a.v)+' (comprobante '+file.name+')');
        if(saldo(l)<=0.005){l.pago='pagado';l.pagoInfo={fecha:fecha,tipo:'abono',comprobante:up};}});
      [...new Set(amts.map(a=>a.p.r))].forEach(r=>{const m=amts.filter(a=>a.p.r===r);hist(r,'registró un abono de '+money(sum(m.map(a=>a.v)))+' en '+m.length+' partida(s) con comprobante '+file.name);});
      amts.forEach(a=>S.sel.delete(key(a.p.r,a.p.l)));await saveMany(amts.map(a=>a.p));return true;}});
}
function payModal(tipo){
  if(tipo==='abono')return abonoModal();
  const picks=selectedPicks(tipo==='pago'?elegPagar:elegCred);if(!picks.length)return;
  const tot=sum(picks.map(x=>x.l.total));
  modal({title:tipo==='pago'?'Registrar pago':'Registrar abono a crédito',html:
    '<p style="margin:0">'+picks.length+' partida'+(picks.length===1?'':'s')+' por <b>'+money(tot)+'</b>. Al subir el comprobante quedan como Pagado y el residente lo verá reflejado.</p>'+
    '<div class="f"><label for="m-fecha">Fecha de pago</label><input id="m-fecha" type="date" value="'+todayISO()+'"></div>'+
    '<div class="f"><label for="m-file">Comprobante de pago <i>*</i></label><input id="m-file" type="file" accept=".pdf,.png,.jpg,.jpeg"></div>',
    ok:'Marcar como pagado',noFocus:true,onOk:async root=>{
      const file=root.querySelector('#m-file').files[0];if(!file)return 'Suba el comprobante de pago.';
      const fecha=root.querySelector('#m-fecha').value||todayISO();
      const up=await uploadFile(file);
      picks.forEach(x=>{x.l.pago='pagado';x.l.pagoInfo={fecha:fecha,tipo:tipo,comprobante:up};lh(x.l,'Pagada por '+money(x.l.total)+' (comprobante '+file.name+')');});
      [...new Set(picks.map(x=>x.r))].forEach(r=>hist(r,(tipo==='pago'?'registró el pago de ':'registró un abono que liquida ')+picks.filter(x=>x.r===r).length+' partida(s) con comprobante '+file.name));
      picks.forEach(x=>S.sel.delete(key(x.r,x.l)));await saveMany(picks);return true;}});
}

async function altaCollect(root,a,exigir,docsOpc){

  if(!nombre)return {err:'Capture el nombre completo del trabajador.'};
  if(exigir&&!obra)return {err:'Indique la obra o proyecto asignado.'};
  const nf={};
  for(const d of ALTA_DOCS){const inp=root.querySelector('#al-f-'+d[0]);const f=inp&&inp.files&&inp.files[0];if(f){const ck=docFilesCheck([f]);if(ck)return {err:d[1]+': '+ck};nf[d[0]]=f;}}
  if(exigir&&!docsOpc){const falta=ALTA_DOCS.filter(d=>!nf[d[0]]&&!(a.docs&&a.docs[d[0]]));if(falta.length)return {err:'Faltan documentos obligatorios: '+falta.map(d=>d[1]).join('; ')+'.'};}
  return {nombre:nombre,obra:obra,nf:nf};
}
async function altaApplyFiles(a,nf){
  for(const k in nf){const lbl=ALTA_DOCS.find(d=>d[0]===k)[1];let up;try{up=await rhUpload(nf[k]);}catch(e){return (e&&e.message)||'No se pudo subir el archivo.';}
    const prev=a.docs&&a.docs[k];a.docs=a.docs||{};a.docs[k]={file:up,t:Date.now(),uid:myId};ah(a,(prev?'Sustituyó':'Cargó')+' '+lbl+': '+nf[k].name);}
  return '';
}

function altaDirecta(){
  modal({title:'Registrar alta directa de trabajador',wide:true,html:altaFormHtml(null,true),ok:'REGISTRAR ALTA',
   onOk:async root=>{
    if(!rhAdm())return 'Solo Administración puede registrar altas directas.';
    const c=await altaCollect(root,{docs:{}},true,true);if(c.err)return c.err;
    const faltan=ALTA_DOCS.filter(d=>!c.nf[d[0]]),motExc=(root.querySelector('#al-exc')||{value:''}).value.trim();
    if(faltan.length&&!motExc)return 'Faltan '+faltan.length+' documento(s): '+faltan.map(d=>d[1]).join('; ')+'. Escriba el motivo de la excepción para registrar el alta sin ellos.';
    const sueldo=Number(root.querySelector('#al-s').value);if(!(sueldo>0))return 'Capture el sueldo base diario (mayor a cero).';
    const dup=S.emps.find(e=>normQ(e.nombre)===normQ(c.nombre)&&e.situacion!=='baja'&&e.activo!==false&&normQ(e.obra||'')===normQ(c.obra));
    if(dup)return 'ALERTA DE DUPLICADO: ya existe un trabajador activo con ese nombre en la misma obra.';
    const x={id:rid(),folio:'ALT-'+code(),creatorId:myId,creado:Date.now(),estado:'aceptada',docs:{},hist:[],origen:'administracion',fechaSol:todayISO(),solicitante:'Administración (alta directa)'};
    const er=await altaApplyFiles(x,c.nf);if(er)return er;
    x.nombre=c.nombre;x.obra=c.obra;x.enviado=Date.now();ah(x,'Registró el alta directamente (sin solicitud del residente)');
    x.dec={uid:myId,t:Date.now(),res:'aceptada',txt:'Alta directa por Administración'};
    if(faltan.length){x.exc={faltan:faltan.map(d=>d[0]),motivo:motExc,uid:myId,t:Date.now()};ah(x,'ALTA CON EXCEPCIÓN DE DOCUMENTOS · faltan: '+faltan.map(d=>d[1]).join('; ')+' · motivo: '+motExc);}

async function altaAceptarCore(a,sueldo,linkId){
  let e=linkId?empById(linkId):null;
  if(e){e=clone(e);if(sueldo>0&&Number(e.sueldo)!==sueldo){nh(e,'Sueldo base diario '+money(e.sueldo)+' → '+money(sueldo)+' (solicitud '+a.folio+')');e.sueldo=sueldo;}
    if(a.obra&&(e.obra||'')!==a.obra){nh(e,'Obra “'+(e.obra||'—')+'” → “'+a.obra+'” (solicitud '+a.folio+')');e.obra=a.obra;}
    nh(e,'Solicitud de alta '+a.folio+' vinculada al expediente existente');}
  else{e={id:rid(),creado:Date.now(),uid:myId,hist:[],nombre:a.nombre,obra:a.obra,sueldo:sueldo,factor:2,vacDias:12,aguiDias:15,horasDia:8,diasLab:DIAS_ALL.slice(),activo:true};nh(e,'Creó el expediente desde la solicitud '+a.folio+' (sueldo base diario '+money(sueldo)+')');}
  if(e.situacion!=='activo')e.situacion='pend_imss';e.activo=true;e.altaId=a.id;
  await saveEmp(e);
  let x=expById(e.id);x=x?clone(x):{id:e.id,creado:Date.now(),laborales:[],hist:[],altas:[]};
  x.nombre=e.nombre;x.obra=e.obra;x.docs=clone(a.docs||{});if(a.exc)x.exc=clone(a.exc);x.fAcept=Date.now();x.aceptadoPor=myId;x.solicitadoPor=a.creatorId;x.solicitadoNom=a.solicitante||'';x.folioAlta=a.folio;x.altas=(x.altas||[]);if(x.altas.indexOf(a.id)<0)x.altas.push(a.id);
  xh(x,'Alta aceptada internamente (solicitud '+a.folio+'). Pendiente de alta formal ante el IMSS.'+(a.exc?' CON EXCEPCIÓN DE DOCUMENTOS: '+a.exc.motivo:''));
  await saveExp(x);
  a.empId=e.id;a.estado='aceptada';ah(a,'Solicitud aceptada; expediente del trabajador '+(linkId?'vinculado':'creado'));
  await saveAlta(a);
}

function altaDecision(a,tipo){
  const cfg={aceptar:['Aceptar solicitud','Aceptar'],devolver:['Devolver para corrección','Devolver'],rechazar:['Rechazar solicitud','Rechazar']}[tipo];
  const bj=esBaja(a);const dups=tipo==='aceptar'&&!bj?S.emps.filter(e=>normQ(e.nombre)===normQ(a.nombre)):[];
  let html='<p style="margin:0">Trabajador: <b>'+esc(a.nombre)+'</b> · '+esc(a.obra)+'</p>';
  if(tipo==='aceptar'&&bj){
    html+='<p style="margin:0">Fecha propuesta de baja: <b>'+fdate(a.fMov)+'</b></p><p style="margin:0;white-space:pre-wrap"><span class="muted">Justificación del residente:</span> '+esc(a.motivo||'')+'</p><p class="muted" style="margin:0;font-size:13px">Al aceptar, la solicitud queda autorizada. La baja formal se registra después, desde el expediente del trabajador, con el documento oficial del IMSS.</p>';
  }else if(tipo==='aceptar'){
    html+='<p class="muted" style="margin:0;font-size:13px">La aceptación es interna y crea el perfil del trabajador en Nómina; <b>no equivale al alta ante el IMSS</b>, que se registra después con su acuse.</p>'+
     '<div class="f"><label for="ad-s">Sueldo base diario <i>*</i></label><input id="ad-s" type="number" min="0" step="any" inputmode="decimal"></div>'+
     (dups.length?'<div class="f"><label for="ad-l">Ya existe un expediente con ese nombre</label><select id="ad-l"><option value="">Crear un expediente nuevo</option>'+dups.map(e=>'<option value="'+esc(e.id)+'" selected>Vincular a: '+esc(e.nombre)+' · '+esc(e.obra||'sin obra')+' ('+esc((SIT_LAB[sitOf(e)]||['sin expediente digital'])[0])+')</option>').join('')+'</select></div>':'');
  }else html+='<div class="f"><label for="ad-t">Justificación <i>*</i></label><textarea id="ad-t" maxlength="800"></textarea></div>'+(tipo==='rechazar'?'<p class="muted" style="margin:0;font-size:13px">El residente recibirá el motivo y podrá corregir la información o sustituir documentos para reenviarla.</p>':'');
  modal({title:cfg[0]+' · '+a.folio,html:html,ok:cfg[1],onOk:async root=>{
    const x=altaById(a.id);if(!x||x.estado!=='pendiente'||!rhAdm())return 'Esta solicitud ya no está pendiente.';
    const c=clone(x);
    if(tipo==='aceptar'&&bj){
      const em=empById(c.empId);if(!em)return 'El trabajador ya no existe en Nómina.';
      c.estado='aceptada';c.dec={uid:myId,t:Date.now(),res:'aceptada',txt:''};ah(c,'Aceptó la solicitud de baja (pendiente de registrar la baja ante el IMSS)');
      const ne=clone(em);nh(ne,'Solicitud de baja '+c.folio+' aceptada; fecha propuesta '+fdate(c.fMov));await saveEmp(ne);
      const xx=expById(em.id);if(xx){const y=clone(xx);xh(y,'Solicitud de baja '+c.folio+' aceptada. Pendiente de registrar la baja ante el IMSS.');await saveExp(y);}
      await saveAlta(c);altaNotify(c,'alta_res','Solicitud de baja aceptada','media',false);return true;}
    if(tipo==='aceptar'){
      const s=Number(root.querySelector('#ad-s').value);if(!(s>0))return 'Capture el sueldo base diario (mayor a cero).';
      const l=root.querySelector('#ad-l');const miss=ALTA_DOCS.filter(d=>!(c.docs&&c.docs[d[0]]));if(miss.length)return 'La solicitud no tiene los seis documentos.';
      c.dec={uid:myId,t:Date.now(),res:'aceptada',txt:''};await altaAceptarCore(c,s,l?l.value:'');altaNotify(c,'alta_res','Solicitud de alta aceptada','media',false);return true;}
    const t=root.querySelector('#ad-t').value.trim();if(!t)return 'Escriba la justificación (obligatoria).';
    c.estado=tipo==='devolver'?'devuelta':'rechazada';c.dec={uid:myId,t:Date.now(),res:c.estado,txt:t};
    ah(c,(tipo==='devolver'?'Devolvió para corrección: ':'Rechazó la solicitud: ')+t);
    await saveAlta(c);altaNotify(c,'alta_res',(bj?'Solicitud de baja ':'Solicitud de alta ')+(tipo==='devolver'?'devuelta para corrección':'rechazada'),'alta',false,t);return true;}});

Object.assign(A,{
  alnew(){if(S.role==='residente')altaForm(null);},
  aldesc(el){const a=altaById(el.dataset.id);if(!a||a.creatorId!==myId||a.estado!=='borrador')return;
    modal({title:'Eliminar borrador '+a.folio,ok:'Eliminar borrador',html:'<p style="margin:0">¿Eliminar el borrador de <b>'+esc(a.nombre||'sin nombre')+'</b>? Solo se pueden eliminar borradores que no se han enviado.</p>',
     onOk:async()=>{const x=altaById(a.id);if(!x||x.estado!=='borrador')return 'Esta solicitud ya no es un borrador.';const y=clone(x);y.oculta=true;ah(y,'Eliminó el borrador');await saveAlta(y);S.altas=S.altas.filter(z=>!z.oculta);S.al.open=null;render();return true;}});},
  alnewb(){if(S.role==='residente')bajaForm(null);},

  aldraft(el){
    const root=document.querySelector('#modal');const id=el.dataset.id;const nw=curModal&&curModal.altaNew;const a=id?altaById(id):(nw?altaById(nw.id):null);
    if(curModal&&curModal.busy)return;
    (async()=>{const err=$('m-err');const c=await altaCollect(root,a||{docs:{}},false);if(c.err){if(err)err.textContent=c.err;return;}
      const dp=altaDupe(c.nombre,a?a.id:(nw?nw.id:''));if(dp){if(err)err.textContent=altaDupeMsg(dp);return;}
      if(curModal)curModal.busy=true;el.disabled=true;const mo=$('m-ok');if(mo)mo.disabled=true;
      const fail=t=>{if(curModal)curModal.busy=false;el.disabled=false;if(mo)mo.disabled=false;if(err)err.textContent=t;};
      const x=a?clone(a):{id:nw?nw.id:rid(),folio:nw?nw.folio:'ALT-'+code(),creatorId:myId,creado:Date.now(),estado:'borrador',docs:{},hist:[],origen:'residente',fechaSol:todayISO()};
      if(!(x.estado==='borrador'||x.estado==='devuelta'||x.estado==='rechazada')){fail('Esta solicitud ya no admite cambios.');return;}
      const er=await altaApplyFiles(x,c.nf);if(er){fail(er);return;}
      x.nombre=c.nombre;x.obra=c.obra;x.solicitante=(S.me&&S.me.nombre)||S.myName||'';if(!a)ah(x,'Creó el borrador de la solicitud');else ah(x,'Guardó cambios en el borrador');
      await saveAlta(x);closeModal();toast('Borrador guardado.');})();
  },
  tfst(el){S.tf.st=el.dataset.k;render();},
  alsub(el){S.al.sub=el.dataset.k;S.al.open=null;S.al.exp=null;render();},
  alopen(el){S.al.open=el.dataset.id;S.al.exp=null;render();},
  alback(){S.al.open=null;S.al.exp=null;render();},
  alexp(el){if(!rhView())return;S.al.exp=el.dataset.id;S.al.open=null;rhLog('Consultó un expediente laboral');render();},
  aldec(el){const a=altaById(el.dataset.id);if(a&&rhAdm())altaDecision(a,el.dataset.k);},

const OTRO_TIPOS=['Contrato','Acta administrativa','Convenio o carta','Incapacidad','Capacitación o constancia','Otro'];
function docVer(o,tag){return (o&&o.ver&&o.ver.length)?'<div class="sub">Versiones anteriores: '+o.ver.map(v=>rhLink(v.file,tag)+' ('+fstamp(v.t)+')').join(' · ')+'</div>':'';}
function expBase(e){const x=expById(e.id);return x?clone(x):{id:e.id,creado:Date.now(),nombre:e.nombre,obra:e.obra,docs:{},laborales:[],hist:[],altas:[],otros:[]};}
function otroModal(e){
  modal({title:'Agregar documento · '+e.nombre,html:'<p class="muted" style="margin:0;font-size:13px">Contratos, actas administrativas y demás documentación del trabajador. Quedan en su expediente y solo Administración puede sustituirlos.</p><div class="grid"><div class="f span2"><label for="od-t">Tipo de documento <i>*</i></label><select id="od-t">'+OTRO_TIPOS.map(t=>'<option>'+t+'</option>').join('')+'</select></div><div class="f"><label for="od-f">Fecha del documento <i>*</i></label><input id="od-f" type="date" value="'+todayISO()+'"></div><div class="f full"><label for="od-n">Descripción u observaciones <i>*</i></label><input id="od-n" maxlength="200" autocomplete="off" placeholder="Ej. Contrato por obra determinada, acta por falta del 12/11"></div><div class="f full"><label for="od-a">Archivo <i>*</i></label><input id="od-a" type="file" accept="'+DOC_ACCEPT+'"></div></div>',ok:'Guardar documento',noFocus:true,
   onOk:async root=>{
    if(!rhAdm())return 'Solo Administración puede agregar documentos.';
    const em=empById(e.id);if(!em)return 'El trabajador ya no existe.';
    const t=root.querySelector('#od-t').value,f=root.querySelector('#od-f').value,n=root.querySelector('#od-n').value.trim(),a=root.querySelector('#od-a').files[0];
    if(!f)return 'Indique la fecha del documento.';if(!n)return 'Escriba una descripción.';if(!a)return 'Cargue el archivo.';
    const ck=docFilesCheck([a]);if(ck)return ck;
    let up;try{up=await rhUpload(a);}catch(er){return (er&&er.message)||'No se pudo subir el archivo.';}
    const x=expBase(em);(x.otros=x.otros||[]).push({id:rid(),tipo:t,fecha:f,nota:n,file:up,fCarga:Date.now(),uid:myId});
    xh(x,'Agregó documento: '+t+' · '+n+' · '+a.name);await saveExp(x);return true;}});
}
function sustModal(e,kind,key,etq){
  const x0=expBase(e);let ex=false;
  if(kind==='doc')ex=!!(x0.docs&&x0.docs[key]);else ex=true;
  modal({title:(ex?'Sustituir':'Cargar')+' documento · '+etq,html:'<p class="muted" style="margin:0;font-size:13px">'+(ex?'El archivo actual no se borra: queda guardado como versión anterior en el expediente.':'Este documento aún no está en el expediente.')+' Solo Administración puede hacerlo.</p>'+(ex?'<div class="f"><label for="sd-m">Motivo de la sustitución <i>*</i></label><textarea id="sd-m" maxlength="500"></textarea></div>':'')+'<div class="f"><label for="sd-f">Archivo nuevo <i>*</i></label><input id="sd-f" type="file" accept="'+DOC_ACCEPT+'"></div>',ok:ex?'Sustituir':'Cargar',noFocus:true,
   onOk:async root=>{
    if(!rhAdm())return 'Solo Administración puede sustituir documentación.';
    const em=empById(e.id);if(!em)return 'El trabajador ya no existe.';
    const mm=root.querySelector('#sd-m'),m=mm?mm.value.trim():'';if(ex&&!m)return 'Escriba el motivo de la sustitución.';
    const f=root.querySelector('#sd-f').files[0];if(!f)return 'Seleccione el archivo.';const ck=docFilesCheck([f]);if(ck)return ck;
    let up;try{up=await rhUpload(f);}catch(er){return (er&&er.message)||'No se pudo subir el archivo.';}
    const x=expBase(em);let t=null;
    if(kind==='doc'){x.docs=x.docs||{};t=x.docs[key];if(!t){x.docs[key]={file:up,t:Date.now(),uid:myId};xh(x,'Cargó '+etq+': '+f.name);}else{(t.ver=t.ver||[]).push({file:t.file,t:t.t,uid:t.uid});t.file=up;t.t=Date.now();t.uid=myId;xh(x,'Sustituyó '+etq+': '+f.name+' · motivo: '+m);}}
    else{const arr=kind==='lab'?x.laborales:x.otros;t=(arr||[]).find(z=>z.id===key);if(!t)return 'No se encontró el documento.';(t.ver=t.ver||[]).push({file:t.file,t:t.fCarga,uid:t.uid});t.file=up;t.fCarga=Date.now();t.uid=myId;xh(x,'Sustituyó '+etq+': '+f.name+' · motivo: '+m);}
    await saveExp(x);return true;}});
}

async function saveProy(o){
  const copy=clone(o);const i=S.proys.findIndex(x=>x.id===o.id);if(i>=0)S.proys[i]=copy;else S.proys.push(copy);
  S.proys.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es'));render();
  if(proyColl){const ref=proyColl.doc(o.id);let err=null;try{await ref.set(copy);}catch(e1){err=e1;try{await ref.update(copy);err=null;}catch(e2){err=e2;}}
    if(err)setTimeout(()=>toast('No se pudo guardar en la base compartida: '+((err&&(err.message||err.code))||String(err))),50);}
}

const ctDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(v+'T12:00:00Z'):null;
const ctAdd=(v,n)=>{const d=ctDate(v);if(!d||!isFinite(n))return '';d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const ctDiff=(a,b)=>{const x=ctDate(a),y=ctDate(b);return x&&y?Math.round((y-x)/864e5):NaN;};
function ctCalc(){
  const g=id=>{const e=$(id);return e?e.value:'';},set=(id,t)=>{const e=$(id);if(e)e.textContent=t;};
  const m=Number(g('ct-monto'))||0,pa=Number(g('ct-pa'))||0,pf=Number(g('ct-pf'))||0;
  set('ct-anticipo',money(r2(m*pa/100)));set('ct-fondo',money(r2(m*pf/100)));
  const ini=g('ct-ini'),fin=g('ct-fin'),d=Number(g('ct-dias'));
  let info='';
  if(ini&&fin){const n=ctDiff(ini,fin)+1;info=n>0?'Periodo de ejecución: '+n+' día'+(n===1?'':'s')+' naturales.':'La fecha de término debe ser posterior al inicio.';}
  else if(ini&&d>0){info='Fecha de término calculada: '+fdate(ctAdd(ini,d-1))+'.';}
  set('ct-plazo',info);
}

/* alertas y calendario de proyectos (solo Administración) */
const AL_TIPOS={ini:'Antes del inicio del contrato',fin:'Antes del término del contrato',fia:'Antes del vencimiento de una fianza',sini:'Antes del límite de registro SIROC',sfin:'Antes del límite de aviso de terminación SIROC',fecha:'En una fecha específica'};
const alWord=a=>a.tipo==='ini'?'inicio del contrato':a.tipo==='fin'?'término del contrato':a.tipo==='fia'?'vencimiento de la fianza':a.tipo==='sini'?'límite de registro SIROC':a.tipo==='sfin'?'límite de aviso de terminación SIROC':'';
function fiaById(p,id){return (p.fianzas||[]).find(f=>f.id===id);}
function alEvento(a,p){const c=p.contrato;if(a.tipo==='fia'){const f=fiaById(p,a.fid);return f&&f.fin;}if(a.tipo==='sini')return sirocLim(p,'ini');if(a.tipo==='sfin')return sirocLim(p,'fin');return a.tipo==='ini'?(c&&c.ini):a.tipo==='fin'?(c&&c.fin&&finEff(p)):a.fecha;}
function alFecha(a,p){const e=alEvento(a,p);if(!e)return '';return a.tipo==='fecha'?e:ctAdd(e,-(Number(a.dias)||0));}
function pyEvents(){
  if(S.role!=='administracion')return [];
  const out=[];
  S.proys.forEach(p=>{
    const c=p.contrato;
    if(c){if(c.ini)out.push({pid:p.id,nom:p.nombre,tipo:'ini',fecha:c.ini,txt:'Inicio del contrato'});if(c.fin){const fv=finEff(p);if(fv!==c.fin)out.push({pid:p.id,nom:p.nombre,tipo:'fin',fecha:c.fin,txt:'Término original del contrato'});out.push({pid:p.id,nom:p.nombre,tipo:'fin',fecha:fv,txt:fv!==c.fin?'Término VIGENTE del contrato (ampliado)':'Término del contrato'});}}
    (p.fianzas||[]).forEach(f=>{out.push({pid:p.id,nom:p.nombre,tipo:'fia',fecha:f.ini,txt:'Inicio de fianza · '+f.afianzadora});out.push({pid:p.id,nom:p.nombre,tipo:'fiaf',fecha:f.fin,txt:'Vencimiento de fianza · '+f.afianzadora+' · '+money(f.monto)});});
    ['ini','fin'].forEach(k=>{const l=sirocLim(p,k);if(l&&!sirocDone(p,k))out.push({pid:p.id,nom:p.nombre,tipo:'sir',fecha:l,txt:k==='ini'?'Límite SIROC: registro de la obra ante el IMSS':'Límite SIROC: aviso de terminación de obra'});});
    (p.alertas||[]).forEach(a=>{const f=alFecha(a,p);if(f)out.push({pid:p.id,nom:p.nombre,tipo:'alerta',fecha:f,txt:a.nota||(a.tipo==='fecha'?'Alerta':(a.dias+' día(s) antes del '+alWord(a)))});});
  });
  return out;
}

/* ───── Aditivas y deductivas (solo Administración) ───── */
const ADI_TIPOS=['Aditiva','Deductiva','Aditiva de tiempo'];
const esT=x=>x.tipo==='Aditiva de tiempo';
function adSum(p){const a=p.adits||[];const f=t=>r2(a.filter(x=>x.tipo===t).reduce((n,x)=>n+(Number(x.monto)||0),0));return {add:f('Aditiva'),ded:f('Deductiva'),n:a.filter(x=>!esT(x)).length,nt:a.filter(esT).length};}
function cEff(p){const c=p.contrato,a=adSum(p),m=r2(c.monto+a.add-a.ded);return {monto:m,anticipo:r2(m*c.pa/100),fondo:r2(m*c.pf/100)};}
function finEff(p,skip){const c=p.contrato;if(!c)return '';let f=c.fin;(p.adits||[]).forEach(x=>{if(esT(x)&&x.id!==skip&&x.fNueva&&x.fNueva>f)f=x.fNueva;});return f;}
/* qué se sale de periodo con la fecha de término vigente */
function fueraPeriodo(p,fin){
  const c=p.contrato,out={fia:[],sir:null};if(!c)return out;fin=fin||finEff(p);if(!(fin>c.fin))return out;
  (p.fianzas||[]).forEach(f=>{if(f.fin<fin)out.fia.push(f);});
  const g=p.siroc&&p.siroc.reg;if(g&&g.fTerm&&g.fTerm<fin)out.sir=g;
  return out;
}
function revisarHtml(p){
  if(S.role!=='administracion'||!p.contrato)return '';
