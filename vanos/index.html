<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levantamiento de vanos</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B5F7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vanos">

<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:500;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:700;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:swap;src:url(./fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}</style>
<style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light dark;--bg:#F2F5F6;--surf:#FFFFFF;--surf2:#F7F9FA;--text:#14232B;--text2:#5B6C74;--line:#D8E0E3;--acc:#0B5F7A;--on-acc:#FFFFFF;--acc-soft:#E0EFF4;--ok:#1B7447;--ok-bg:#E0F2E8;--warn:#8F5206;--warn-bg:#FCEFD6;--bad:#A8261F;--bad-bg:#FAE3E1;--info:#3D4FA3;--info-bg:#E7EAF9;--grid:rgba(11,95,122,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--surf:#17252C;--surf2:#1C2C34;--text:#E6EEF1;--text2:#9BB0B8;--line:#2B3D46;--acc:#5CC0DE;--on-acc:#0B1B21;--acc-soft:#183A47;--ok:#62D093;--ok-bg:#163A29;--warn:#F0B35A;--warn-bg:#3D2D12;--bad:#FF8F87;--bad-bg:#442220;--info:#9EB0FF;--info-bg:#232B52;--grid:rgba(92,192,222,.08)}}
:root[data-theme="dark"]{--bg:#0F1A1F;--surf:#17252C;--surf2:#1C2C34;--text:#E6EEF1;--text2:#9BB0B8;--line:#2B3D46;--acc:#5CC0DE;--on-acc:#0B1B21;--acc-soft:#183A47;--ok:#62D093;--ok-bg:#163A29;--warn:#F0B35A;--warn-bg:#3D2D12;--bad:#FF8F87;--bad-bg:#442220;--info:#9EB0FF;--info-bg:#232B52;--grid:rgba(92,192,222,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;position:relative}
section{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
h1{font-size:18px;margin:0;font-weight:700;line-height:1.2}
h2{font-size:16px;margin:0 0 8px;font-weight:600}
h3{font-size:15px;margin:16px 0 6px;font-weight:600}
p{margin:0}.muted{color:var(--text2)}.small{font-size:13px}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--text2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;touch-action:manipulation;transition:border-color .12s,color .12s,background .12s}
@media(hover:hover){.btn:hover{border-color:var(--acc);color:var(--acc)}}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
@media(hover:hover){.btn.primary:hover{color:var(--on-acc);filter:brightness(1.1)}}
.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.big{min-height:56px;font-size:16px;border-radius:10px}
.btn.sm{min-height:40px;padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
@media(hover:hover){.btn.danger:hover{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text2);display:inline-block}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.badge:empty{display:none}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--text)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:12px}
label.f>*:not(span){margin-top:4px;color:var(--text);font-weight:400;font-size:15px}
.req{color:var(--bad);font-style:normal;margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.er{color:var(--bad)}p.er{font-weight:700;font-size:13px}.ok{color:var(--ok)}
/* barra superior y menú */
.lhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
#coName{font-size:12px;color:var(--text2)}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shell{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.menu{overflow:auto;background:var(--surf);border-right:1px solid var(--line);padding:10px 0 24px}
.menu .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:14px 18px 6px}
.menu .nav{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px 0 28px;border:0;border-left:3px solid transparent;background:none;text-align:left;font-weight:500;font-size:14px;cursor:pointer}
@media(hover:hover){.menu .nav:hover{background:var(--surf2)}}
.menu .nav.on{color:var(--acc);background:var(--acc-soft);border-left-color:var(--acc);font-weight:600}
.menu .cnt{background:var(--acc);color:var(--on-acc);border-radius:99px;font-size:12px;font-weight:600;padding:0 8px;min-width:22px;text-align:center}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.menu{display:none}#actbar{left:0!important}.lhead{padding:10px 16px}.lmain{padding:16px!important}}
/* listado */
.lmain{overflow:auto;padding:18px 24px 120px;min-width:0}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.sum{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum[data-act]{cursor:pointer}
@media(hover:hover){.sum[data-act]:hover{border-color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}}
.sum .l{font-size:12.5px;font-weight:600;color:var(--text2)}.sum .n{font-size:22px;font-weight:700;line-height:1.25}.sum .t{font-size:12px;color:var(--text2)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px;margin:0 0 8px}
.filters input{grid-column:1/-1}
.selrow{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
#listBody{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
@media(max-width:420px){#listBody{grid-template-columns:minmax(0,1fr)}}
.lcard{display:grid;grid-template-columns:52px 76px minmax(0,1fr);gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;min-height:100px;transition:border-color .12s,box-shadow .12s}
@media(hover:hover){.lcard:hover{border-color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}}
.lcard.sel{background:var(--acc-soft);border-color:var(--acc)}
.lcard .chk{display:flex;align-items:center;justify-content:center;height:100%;min-height:100px;cursor:pointer}
.lcard .chk input{width:24px;height:24px;accent-color:var(--acc);pointer-events:none}
.lcard .th{width:76px;height:60px;background:var(--surf2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:11px;cursor:pointer}
.lcard .th img{width:100%;height:100%;object-fit:cover}
.lcard .meta{padding:10px 10px 10px 0;cursor:pointer;min-width:0}
.lcard .ttl{font-size:16px;font-weight:600;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surf2);color:var(--text2);border:1px solid var(--line)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ok,.c-sync-s{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.c-obs,.c-sync-p{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.c-no,.c-sync-e{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.c-sync-u{background:var(--info-bg);color:var(--info);border-color:transparent}
#actbar{position:absolute;left:232px;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;overflow-x:auto;z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
#actbar .btn{flex:none}
#selN{flex:none;padding:0 6px;color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surf);color:var(--text2)}
.empty h2{font-size:16px;font-weight:700;color:var(--text);margin:0 0 4px}
.empty p{max-width:52ch;margin:0 auto}
/* editor */
.topbar{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--surf);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.topbar .ttl{flex:1;min-width:140px;display:flex;flex-direction:column;line-height:1.25}
.topbar .ttl b{font-family:var(--mono);font-size:14px;font-weight:600}
.topbar .btn{flex:none}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
@media(max-width:980px){.work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(220px,42%)}}
.stageCol{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background-color:var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#img{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#ph{position:absolute;inset:16px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--surf);border:1px dashed var(--line);border-radius:12px}
#ph .btn{min-width:280px}
.ftools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
@media(max-width:980px){.ftools{flex-direction:row;flex-wrap:wrap;right:10px}}
.ftools .btn{min-height:50px;min-width:64px;flex-direction:column;gap:0;font-size:12px;padding:2px 8px;box-shadow:0 1px 2px rgba(0,0,0,.18);line-height:1.1}
.ftools .btn i{font-style:normal;font-size:19px;line-height:1.1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:3;max-width:92%;text-align:center;display:flex;gap:10px;align-items:center}
#hint .btn{min-height:34px;padding:0 12px;background:var(--surf);color:var(--text);border-color:transparent}
.chips{display:flex;gap:6px;padding:8px 10px;background:var(--surf);border-top:1px solid var(--line);overflow-x:auto;flex:none;align-items:stretch}
.cg{display:flex;gap:4px;padding-right:8px;margin-right:4px;border-right:1px solid var(--line);align-items:center;flex:none}
.cg>span{font-size:11px;font-weight:700;color:var(--text2);writing-mode:vertical-rl;transform:rotate(180deg);text-transform:uppercase;letter-spacing:.06em}
.ch{min-height:54px;min-width:62px;border-radius:8px;border:1px solid var(--line);border-bottom:5px solid var(--c);background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;cursor:pointer;line-height:1.15;touch-action:manipulation}
.ch b{font-family:var(--mono);font-size:14px;font-weight:600}.ch small{font-size:11.5px;color:var(--text2)}
.ch.done small{color:var(--text);font-weight:700;font-family:var(--mono);font-size:12.5px}
.ch.on{background:var(--acc-soft);border-color:var(--acc);border-bottom-color:var(--c);color:var(--acc)}.ch.on small{color:var(--acc)}
.panel{display:flex;flex-direction:column;background:var(--surf);border-left:1px solid var(--line);min-height:0}
@media(max-width:980px){.panel{border-left:0;border-top:1px solid var(--line)}}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:48px;border:0;background:none;font-weight:600;font-size:14px;color:var(--text2);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
#tabBody{flex:1;overflow:auto;padding:12px 14px 40px}
#croq{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
#croq svg{display:block;width:100%;height:auto;max-height:300px}
.ind{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-weight:600;font-size:13px;background:var(--surf2);border:1px solid var(--line)}
.ind.l0{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ind.l1{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.ind.l2{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.cls{padding:10px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--t);background:var(--tb);border:1px solid color-mix(in srgb,var(--t) 35%,transparent);margin-bottom:8px;text-align:center}
.mrow{display:grid;grid-template-columns:44px 1fr 104px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow.on{background:var(--acc-soft)}
.mrow .cd{color:#fff;font-family:var(--mono);font-weight:600;text-align:center;border-radius:6px;padding:5px 0;font-size:13px}
.mrow input{min-height:44px;font-family:var(--mono);font-size:16px;font-weight:600;text-align:right;padding:4px 8px}
.stbtn{display:block;width:100%;min-height:60px;margin-bottom:8px;border-radius:10px;border:2px solid var(--line);background:var(--surf);font-size:16px;font-weight:700;text-align:left;padding:0 16px;cursor:pointer}
@media(hover:hover){.stbtn:hover{border-color:var(--acc)}}
.stbtn.on.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.stbtn.on.obs{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.stbtn.on.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig .box{border:1px dashed var(--line);border-radius:10px;min-height:110px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center}
.sig img{max-width:100%;max-height:70px;background:#fff;border-radius:4px}
.hist{font-size:13px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
/* ventanas */
.mdl{position:fixed;inset:0;background:rgba(10,24,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(560px,100%);max-height:92%;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mbox.w{width:min(760px,100%)}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.bigin{font-family:var(--mono);font-size:32px!important;font-weight:600;text-align:center;min-height:72px!important}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--acc)}
.bar{height:10px;background:var(--surf2);border:1px solid var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);width:0}
.jrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.note{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.note.ok-note{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.note.bad-note{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:90;max-width:90%;text-align:center}
canvas.sigpad{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="./lib/jszip.min.js"></script>
<script src="./lib/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app">
<section id="listScreen">
  <header class="lhead">
    <div class="brand"><h1>Levantamiento de vanos</h1><p id="coName"></p></div>
    <div class="hr"><span class="pill" id="netInd"></span><span class="pill" id="stoInd"></span>
      <button class="btn" data-act="queues">Colas <span class="badge" id="qBadge"></span></button>
      <button class="btn" data-act="settings">Ajustes</button></div>
  </header>
  <div class="shell">
    <nav class="menu" id="menu" aria-label="Menú lateral"></nav>
    <div class="lmain">
      <button class="btn primary big" style="width:100%" data-act="new">+ Nuevo levantamiento</button>
      <div class="sumgrid" id="summary"></div>
      <div class="filters">
        <input id="fq" type="text" placeholder="Buscar vano, folio, nivel, departamento…" autocomplete="off">
        <select id="fproj" data-f="proj"></select><select id="fnivel" data-f="nivel"></select><select id="fdep" data-f="dep"></select><select id="festado" data-f="estado"></select><select id="fsync" data-f="sync"></select>
      </div>
      <div class="selrow">
        <button class="btn sm" data-act="selmenu">Selección múltiple…</button>
        <button class="btn sm ghost" data-act="selvis">Seleccionar visibles</button>
        <button class="btn sm ghost" data-act="selnone">Quitar selección</button>

/* ---- análisis de irregularidades y tolerancias ---- */
function evaluate(rec){
 const g=c=>getVal(rec,c),tol=tolOf(rec),on=!!tol.on;
 const W=['A1','A2','A3'].map(g).filter(v=>v!=null),Hh=['H1','H2','H3'].map(g).filter(v=>v!=null);
 const spread=a=>a.length>1?Math.max(...a)-Math.min(...a):null;
 const sW=spread(W),sH=spread(Hh),D1=g('D1'),D2=g('D2'),diag=D1!=null&&D2!=null?Math.abs(D1-D2):null;
 const desp=g('DESP')!=null?Math.abs(g('DESP')):null,desn=g('DESN')!=null?Math.abs(g('DESN')):null;
 const lv=(v,lim)=>v>lim+1e-9?2:(v>=.75*lim?1:0);
 const chk={};
 if(on){
  const dev=(arr,nom,t)=>{if(nom&&arr.length){const v=Math.max(...arr.map(x=>Math.abs(x-nom)));return{v,lim:t,txt:'desviación máx. contra medida de proyecto'}}const s=spread(arr);return s==null?null:{v:s,lim:2*t,txt:'diferencia entre lecturas (±'+t+' mm)'}};
  const a=dev(W,rec.nomAncho,tol.ancho),h=dev(Hh,rec.nomAlto,tol.alto);
  if(a)chk.ancho={...a,lvl:lv(a.v,a.lim),name:'Ancho'};if(h)chk.alto={...h,lvl:lv(h.v,h.lim),name:'Altura'};
  if(diag!=null)chk.diag={v:diag,lim:tol.diag,lvl:lv(diag,tol.diag),name:'Diagonales',txt:'diferencia máxima'};
  if(desp!=null)chk.desp={v:desp,lim:tol.desplome,lvl:lv(desp,tol.desplome),name:'Desplome',txt:'máximo'};
 }
 const mk=(k,v,label,fn)=>({k,v,label,lvl:v==null?null:(chk[k]?chk[k].lvl:(v>0?1:0)),msg:v==null?null:fn(v)});
 const ind=[mk('ancho',sW,'Diferencia de anchos',v=>`Diferencia máxima de ancho: ${fmt(v)} mm`),mk('alto',sH,'Diferencia de alturas',v=>`Diferencia máxima de altura: ${fmt(v)} mm`),
  mk('diag',diag,'Vano descuadrado',v=>`Posible descuadre del vano: diferencia de diagonales = ${fmt(v)} mm`),mk('desp',desp,'Posible desplome',v=>`Posible desplome: ${fmt(g('DESP'))} mm`),mk('desn',desn,'Desnivel',v=>`Desnivel: ${fmt(g('DESN'))} mm`)].filter(i=>i.v!=null);
 const vals=Object.values(chk);let cls=null;if(on)cls=vals.length?['ok','rev','bad'][Math.max(...vals.map(c=>c.lvl))]:'none';
 return{ind,chk,cls,tol,on};
}

 modal(`<h2>Ajustes</h2><h3>Empresa</h3><label class="f"><span>Nombre de la empresa</span><input id="sCo" value="${esc(st.company||'')}"></label><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><button class="btn sm" data-ma="logo">Subir logo</button>${st.logo?`<img src="${st.logo}" alt="Logo" style="height:44px;background:#fff;border:1px solid var(--line);border-radius:4px">`:'<span class="muted small">Sin logo (aparece en el PDF)</span>'}</div>
 <label class="f"><span>Responsable predeterminado</span><input id="sRe" value="${esc(st.resp||'')}"></label>
 <h3>Tolerancias por proyecto</h3>${Object.keys(S.projects).length?Object.keys(S.projects).map(p=>`<div class="jrow"><span>${esc(p)} <small class="muted">${S.projects[p].tol.on?'· tolerancias activas':'· sin tolerancias'}</small></span><button class="btn sm" data-ma="tol" data-p="${esc(p)}">Configurar</button></div>`).join(''):'<p class="muted small">Los proyectos aparecen al crear el primer levantamiento.</p>'}
 <h3>Google Drive</h3><label class="f"><span>Client ID de OAuth (aplicación web)</span><input id="sCid" value="${esc(st.clientId||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><label class="f"><span>API Key (solo para elegir carpetas existentes)</span><input id="sKey" value="${esc(st.apiKey||'')}"></label>
 <div class="note">La subida real a Drive necesita que esta página se aloje en un dominio propio autorizado en Google Cloud (orígenes de JavaScript del Client ID). En la vista de vista previa de Claude el navegador bloquea las conexiones a Google, y la app lo indicará sin simular ninguna subida.</div>
 <h3>Datos</h3><button class="btn sm" data-ma="sample">Cargar vano de ejemplo</button>
 <div class="acts"><button class="btn" data-ma="no">Cancelar</button><button class="btn primary" data-ma="ok">Guardar</button></div>`,
 {onMount:(el,close)=>el.addEventListener('click',async e=>{const a=e.target.closest('[data-ma]');if(!a)return;const t=a.dataset.ma;
  if(t==='no')return close();if(t==='logo'){$('#fLogo').click();return}if(t==='tol'){close();tolModal(a.dataset.p);return}if(t==='sample'){close();await loadSample();return}
  await kvSet('settings',{...S.settings,company:$('#sCo',el).value.trim(),resp:$('#sRe',el).value.trim(),clientId:$('#sCid',el).value.trim(),apiKey:$('#sKey',el).value.trim()});close();renderList();toast('Ajustes guardados')})})}
async function loadSample(){
 const rec=await createRec({project:'Ejemplo',tower:'A',level:'5',dept:'502',vano:String(nextVano('Ejemplo','5','502')),type:'Ventana',date:dateStr(),resp:S.settings.resp||'Residente demo',obs:''});
 const W=1600,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#B9B5AE';x.fillRect(0,0,W,H);for(let i=0;i<900;i++){x.fillStyle=`rgba(${80+Math.random()*80|0},${80+Math.random()*80|0},${80+Math.random()*80|0},.12)`;x.fillRect(Math.random()*W,Math.random()*H,8+Math.random()*30,3+Math.random()*8)}
 x.fillStyle='#2B3138';x.beginPath();x.moveTo(520,250);x.lineTo(1090,262);x.lineTo(1100,1010);x.lineTo(510,1000);x.closePath();x.fill();x.fillStyle='#E9EDF0';x.font='bold 30px Arial';x.fillText('FOTO DE EJEMPLO',40,60);
 rec.photo=rec.photoOrig=c.toDataURL('image/jpeg',.88);rec.thumb=await makeThumb(rec.photo);
 const P=(a,b,cd,v)=>{const k=cd;const d={id:uid(),kind:k,code:cd,name:'',value:v,p1:{x:a[0]/W,y:a[1]/H},p2:{x:b[0]/W,y:b[1]/H}};rec.dims.push(d)};
 P([520,215],[1090,227],'A1',1250);P([515,620],[1095,632],'A2',1244);P([510,1045],[1100,1055],'A3',1232);P([470,250],[460,1000],'H1',2100);P([800,300],[795,960],'H2',2108);P([1150,262],[1145,1010],'H3',2095);P([520,250],[1100,1010],'D1',2105);P([1090,262],[510,1000],'D2',2122);
 rec.marks.push({id:uid(),x:.62,y:.2,text:'Muro desplomado'});rec.history.push({t:nowISO(),m:'Vano de ejemplo cargado'});await persist(rec,false);renderList();toast('Vano de ejemplo creado');openEditor(rec.id)}

/* ================= eventos globales ================= */
function selIds(){return[...S.sel]}
function exportIds(ids,keys,o){if(!ids.length)return toast('Seleccione al menos un levantamiento');runExport(ids,keys,o)}
function dlDialog(ids){modal(`<h2>Descargar ${ids.length} levantamiento${ids.length===1?'':'s'}</h2>${Object.keys(KEYLABEL).map(k=>`<label class="opt"><input type="checkbox" data-k="${k}" checked> ${KEYLABEL[k]}</label>`).join('')}<p class="muted small">Un solo archivo se descarga directo. Varios archivos se entregan en un ZIP con carpetas PDF, FOTOGRAFIAS_ORIGINALES, FOTOGRAFIAS_COTADAS, CROQUIS, DXF y RESUMEN.</p><div class="acts"><button class="btn" data-ma="no">Cancelar</button><button class="btn primary" data-ma="ok">Generar descarga</button></div>`,
 {onMount:(el,close)=>el.addEventListener('click',e=>{const a=e.target.closest('[data-ma]');if(!a)return;close();if(a.dataset.ma==='ok'){const k=$$('input[data-k]',el).filter(c=>c.checked).map(c=>c.dataset.k);if(k.length)exportIds(ids,k)}})})}
function selMenu(){const L=filtered(),cnt=(k,v)=>L.filter(r=>r[k]===v).length;const u=(k,src=L)=>[...new Set(src.map(r=>r[k]).filter(Boolean))];
 const sec=(t,k,vals,src)=>vals.length?`<h3>${t}</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${vals.map(v=>`<button class="btn sm" data-ma="sel" data-k="${k}" data-v="${esc(v)}">${esc(v)} (${(src||L).filter(r=>r[k]===v).length})</button>`).join('')}</div>`:'';
 modal(`<h2>Seleccionar varios</h2><button class="btn" style="width:100%" data-ma="all">Todos los filtrados (${L.length})</button>${sec('Todo un proyecto','project',u('project',S.levs),S.levs)}${sec('Todo un nivel','level',u('level'))}${sec('Todo un departamento','dept',u('dept'))}<h3>Por estado</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${['ok','obs','no'].map(s=>`<button class="btn sm" data-ma="st" data-v="${s}">${STATUS[s].e} ${STATUS[s].t} (${L.filter(r=>r.status===s).length})</button>`).join('')}</div><div class="acts"><button class="btn" data-ma="clr">Quitar selección</button><button class="btn primary" data-ma="x">Listo</button></div>`,
 {onMount:(el,close)=>el.addEventListener('click',e=>{const a=e.target.closest('[data-ma]');if(!a)return;const t=a.dataset.ma;if(t==='x')return close();
  if(t==='all')L.forEach(r=>S.sel.add(r.id));else if(t==='clr')S.sel.clear();else if(t==='sel'){const k=a.dataset.k,v=a.dataset.v;(k==='project'?S.levs:L).filter(r=>r[k]===v).forEach(r=>S.sel.add(r.id))}else if(t==='st')L.filter(r=>r.status===a.dataset.v).forEach(r=>S.sel.add(r.id));
  renderList();toast(S.sel.size+' seleccionados',1200)})})}
async function exportOne(k){await flushSave();const id=cur.id;
 if(k==='dwg'){modal(`<h2>DWG no disponible en el navegador</h2><p>Un archivo DWG válido solo puede crearse con software de Autodesk o con el motor ODA/Teigha. Esta app no simula esa exportación.</p><p style="margin-top:8px">Lo que sí genera es un <b>DXF compatible con AutoCAD</b> con la geometría vectorial del vano hecha solo con sus cotas (capas VANO, COTAS_ANCHOS, COTAS_ALTURAS, DIAGONALES). Ábralo en AutoCAD y use «Guardar como… DWG».</p><div class="acts"><button class="btn" data-ma="no">Cerrar</button><button class="btn primary" data-ma="ok">Descargar DXF</button></div>`,{onMount:(el,close)=>el.addEventListener('click',e=>{const a=e.target.closest('[data-ma]');if(!a)return;close();if(a.dataset.ma==='ok')runExport([id],['dxf'],{silent:true})})});return}
 if(k==='png'){try{const b=await cotadaBlob(cur,'image/png');download(b,fname(cur,'foto_cot').replace('.jpg','.png'));logH('Exportó imagen PNG');scheduleSave()}catch(e){toast(e.message)}return}
 if(k==='jpg')return runExport([id],['foto_cot'],{silent:true});if(k==='pack')return runExport([id],[...Object.keys(KEYLABEL)]);runExport([id],[k],{silent:true})}

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.closest('[data-id]')?.dataset.id;
 if(a==='tol'){e.preventDefault();return tolModal(cur.project)}if(a==='refolio'){e.preventDefault();cur.folio=makeFolio(cur);logH('Regeneró folio');$('#edFolio').textContent=cur.folio;scheduleSave();renderTab();return}
 switch(a){
 case'navest':S.f.estado=t.dataset.v;return renderList();case'navproj':S.f.proj=S.f.proj===t.dataset.v?'':t.dataset.v;return renderList();case'new':return openNewForm();case'settings':return openSettings();case'queues':return openQueues();case'sample':return loadSample();
 case'open':return openEditor(id);case'toggle':S.sel.has(id)?S.sel.delete(id):S.sel.add(id);return renderList();
 case'selmenu':return selMenu();case'selvis':filtered().forEach(r=>S.sel.add(r.id));return renderList();case'selnone':S.sel.clear();return renderList();
 case'bar-dl':return dlDialog(selIds());case'bar-pdf':return exportIds(selIds(),['pdf']);case'bar-img':return exportIds(selIds(),['foto_orig','foto_cot','croquis']);case'bar-dxf':return exportIds(selIds(),['dxf']);
 case'bar-pack':return exportIds(selIds(),Object.keys(KEYLABEL));case'bar-drive':return selIds().length?openDriveDialog(selIds()):toast('Seleccione al menos un levantamiento');
 case'back':return closeEditor();case'undo':return undo();case'redo':return redo();
 case'saveClose':{if(!cur.status){S.tab='cierre';renderTab();return toast('Seleccione el estado del vano antes de guardar')}
  if(cur.status!=='ok'&&!(cur.reason||'').trim()){S.tab='cierre';renderTab();return toast('Escriba el motivo del estado seleccionado')}
  logH('Guardó levantamiento · estado '+STATUS[cur.status].t);await flushSave();toast('Levantamiento guardado');return closeEditor()}
 case'photo':return modal(`<h2>Fotografía</h2><button class="btn primary big" style="width:100%;margin-bottom:10px" data-ma="cam">Tomar fotografía</button><button class="btn big" style="width:100%" data-ma="pick">Seleccionar fotografía</button><div class="acts"><button class="btn" data-ma="x">Cerrar</button></div>`,{onMount:(el,close)=>el.addEventListener('click',ev=>{const b=ev.target.closest('[data-ma]');if(!b)return;close();if(b.dataset.ma==='cam')$('#fCam').click();if(b.dataset.ma==='pick')$('#fPick').click()})});
 case'cam':return $('#fCam').click();case'pick':return $('#fPick').click();
 case'hand':return setTool('select');case'note':return cur.photo?chooseMark():toast('Primero agregue la fotografía');
 case'rotate':return rotatePhoto();case'crop':if(!cur.photo)return toast('Primero agregue la fotografía');return setTool('crop');case'cropOk':return applyCrop();case'cancelTool':return setTool('select');
 case'adjust':return cur.photo?adjustSheet():null;case'fit':return fitView();
 case'zin':{const r=vp().getBoundingClientRect();return zoomAt(r.width/2,r.height/2,1.3)}case'zout':{const r=vp().getBoundingClientRect();return zoomAt(r.width/2,r.height/2,1/1.3)}
 case'tab':S.tab=t.dataset.t;return renderTab();
 case'chip':if(!cur.photo)return toast('Primero agregue la fotografía');return startDim(t.dataset.code);case'others':return othersMenu();
 case'mark':if(!cur.photo)return toast('Primero agregue la fotografía');return startDim(t.dataset.code,cur.dims.find(d=>d.code===t.dataset.code)?.kind||t.dataset.code);
 case'delm':{beforeChange();cur.dims=cur.dims.filter(d=>d.code!==t.dataset.code);logH('Eliminó '+t.dataset.code);changed();return renderTab()}
 case'addm':{const k=t.dataset.k;let nm='';if(KINDS[k].named){const r=await promptValue({title:'Medida personalizada',value:null,named:true});if(!r)return;nm=r.name;beforeChange();const d=newDim(k,nm);d.value=r.value;cur.dims.push(d);logH(`${d.code} ${nm}`);changed();return renderTab()}
  beforeChange();cur.dims.push(newDim(k));changed();renderTab();const ins=$$('#tabBody .mrow input');ins[ins.length-1]?.focus();return}
 case'delmark':beforeChange();cur.marks=cur.marks.filter(m=>m.id!==t.dataset.id);changed();return renderTab();
 case'status':beforeChange();cur.status=t.dataset.v;logH('Estado: '+STATUS[cur.status].t);changed();return renderTab();
 case'sign':return signPad(t.dataset.k);
 case'gps':return navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{cur.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};logH('Capturó GPS');scheduleSave();renderTab()},er=>toast('No se pudo obtener el GPS: '+er.message),{enableHighAccuracy:true,timeout:15000}):toast('GPS no disponible');
 case'nogps':cur.gps=null;scheduleSave();return renderTab();
 case'copym':return copyMedidas();case'dup':return duplicate();case'ex':return exportOne(t.dataset.k);
 case'delrec':{if(await confirmBox('Eliminar levantamiento',`Se borrará ${cur.folio} con su historial y archivos. No se puede deshacer.`,'Eliminar',true)){const rid=cur.id;clearTimeout(saveT);cur=null;S.levs=S.levs.filter(r=>r.id!==rid);S.sel.delete(rid);await DB.del('levs',rid);$('#editScreen').hidden=true;$('#listScreen').hidden=false;renderList();toast('Levantamiento eliminado')}return}
 }
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f&&t.closest('.filters')){S.f[t.dataset.f]=t.value;return renderList()}
 const a=t.dataset.act;if(!a||!cur)return;
 if(a==='val'){const v=parseMM(t.value);if(isNaN(v)){toast('Número no válido');t.value='';return}const c=t.dataset.code;let d=cur.dims.find(x=>x.code===c);beforeChange();if(!d){d={id:uid(),kind:c,code:c,name:'',value:null,p1:null,p2:null};cur.dims.push(d)}d.value=v;if(v!=null)t.value=fmt(v);logH(`${c} = ${v!=null?fmt(v)+' mm':'sin valor'}`);changed();return}
 if(a==='fld'){const f=t.dataset.f;beforeChange();cur[f]=t.value.trim();logH(`Editó ${f}`);if(f==='project')ensureProject(cur.project);$('#edSub').textContent=`${cur.project} · ${ubic(cur)} · ${cur.type} · N.º ${pad(cur.seq||0,4)}`;changed();return}
 if(a==='nom'){const v=parseMM(t.value);cur[t.dataset.f]=isNaN(v)?null:v;scheduleSave();refreshAll()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fq'){S.f.q=t.value;return renderList()}if(!cur)return;
 if(t.dataset.act==='obs'){cur.obs=t.value;scheduleSave()}if(t.dataset.act==='reason'){cur.reason=t.value;scheduleSave()}});
$('#fCam').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&cur)setPhoto(f)});
$('#fPick').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&cur)setPhoto(f)});
$('#fLogo').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const u=await fileToPhoto(f,600);const png=await loadImg(u);const c=document.createElement('canvas');c.width=png.naturalWidth;c.height=png.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(png,0,0);await kvSet('settings',{...S.settings,logo:c.toDataURL('image/png')});toast('Logo guardado');openSettings()}catch(er){toast(er.message)}});
function copyMedidas(){const others=S.levs.filter(r=>r.id!==cur.id&&r.dims.some(d=>d.value!=null)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
 if(!others.length)return toast('No hay otros vanos con medidas');
 modal(`<h2>Copiar medidas de otro vano</h2><p class="muted small">Se copian solo los valores (mm). Las líneas sobre su foto no cambian.</p><div style="max-height:360px;overflow:auto">${others.map(r=>`<button class="btn" style="width:100%;margin-bottom:6px;justify-content:space-between" data-ma="${r.id}"><span>${esc(r.folio)}</span><span class="muted small">${r.dims.filter(d=>d.value!=null).length} medidas</span></button>`).join('')}</div><div class="acts"><button class="btn" data-ma="no">Cancelar</button></div>`,
 {onMount:(el,close)=>el.addEventListener('click',e=>{const a=e.target.closest('[data-ma]');if(!a)return;close();if(a.dataset.ma==='no')return;const src=S.levs.find(r=>r.id===a.dataset.ma);beforeChange();
  src.dims.filter(d=>d.value!=null).forEach(sd=>{let d=cur.dims.find(x=>x.code===sd.code);if(!d){d={id:uid(),kind:sd.kind,code:sd.code,name:sd.name,value:null,p1:null,p2:null};cur.dims.push(d)}d.value=sd.value});logH('Copió medidas de '+src.folio);changed();renderTab();toast('Medidas copiadas')})})}
async function duplicate(){await flushSave();const n=await createRec({project:cur.project,tower:cur.tower,level:cur.level,dept:cur.dept,vano:String(nextVano(cur.project,cur.level,cur.dept)),type:cur.type,date:dateStr(),resp:cur.resp,obs:''});
 n.dims=cur.dims.filter(d=>d.value!=null).map(d=>({...d,id:uid(),p1:null,p2:null}));n.nomAncho=cur.nomAncho;n.nomAlto=cur.nomAlto;n.history.push({t:nowISO(),m:'Duplicado de '+cur.folio});await persist(n,false);toast('Duplicado como vano '+n.vano);await closeEditor();openEditor(n.id)}

/* ================= arranque ================= */
window.addEventListener('online',()=>{updateInd();toast('Conexión restablecida');if(drive.token&&drive.exp>Date.now()&&S.queue.some(i=>i.state==='pending'))runSync()});
window.addEventListener('offline',()=>{updateInd();toast('Sin conexión: todo se guarda en este equipo')});
window.addEventListener('resize',()=>{if(cur&&!$('#editScreen').hidden&&imgW)renderOverlay()});
document.addEventListener('DOMContentLoaded',async()=>{
 await DB.open();
 try{(await DB.all('kv')).forEach(x=>{S[x.k]=x.v})}catch(e){}
 try{S.levs=(await DB.all('levs')).map(r=>{r.files=r.files||[];r.dims=r.dims||[];r.marks=r.marks||[];r.history=r.history||[];r.signs=r.signs||{};r.adj=r.adj||{b:0,c:0};return r})}catch(e){}
 if(!DB.ok)toast('El navegador no permite almacenamiento persistente: los datos se perderán al cerrar.',6000);
 S.queue=(S.queue||[]).map(i=>i.state==='uploading'?{...i,state:'pending'}:i);
 renderList();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
});

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e)))}
</script>
</body>
